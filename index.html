  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
      --ink: #201e1c;
      --muted: #65605b;
      --line: #d4cec7;
      --paper: #f9f8f6;
      --canvas: #eae6e0;
      --neutral-soft: #e2ddd6;
      --chart-grid: #d8d2ca;
      --chart-grid-minor-opacity: 0.38;
      --chart-grid-mid-opacity: 0.65;
      --chart-muted: #6d6862;
      --slider-track: #99938c;
      --slider-thumb: #3f3b37;
      --slider-thumb-hover: #24211e;
      --slider-ring: #f9f8f6;
      --scrollbar-thumb: #bbb5ad;
      --shadow: 0 12px 36px rgb(0 0 0 / 5%);
      --radius-panel: 18px;
      --radius-card: 12px;
      --radius-ctrl: 9px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #edeae6;
        --muted: #a09b95;
        --line: #36332f;
        --paper: #211f1d;
        --canvas: #171615;
        --neutral-soft: #2e2b28;
        --chart-grid: #302d2a;
        --chart-grid-minor-opacity: 0.32;
        --chart-grid-mid-opacity: 0.62;
        --chart-muted: #98938d;
        --slider-track: #6e6964;
        --slider-thumb: #cbc6c0;
        --slider-thumb-hover: #e4dfd9;
        --slider-ring: #171615;
        --scrollbar-thumb: #4d4944;
        --shadow: 0 16px 42px rgb(0 0 0 / 26%);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font: 400 15px/1.45 var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    .app {
      display: flex;
      max-width: 1560px;
      height: 100vh;
      min-height: 0;
      flex-direction: column;
      margin: 0 auto;
      padding: 21px 27px;
      gap: 18px;
    }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .brand-identity {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .brand-footnotes {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-inline: auto;
      padding-inline: 16px;
      min-width: 0;
      text-align: left;
      color: var(--muted);
      opacity: 0.58;
      font-size: 10.5px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .brand-footnote-item {
      margin: 0;
      text-wrap: balance;
    }

    .brand-footnote-item.is-hidden {
      visibility: hidden;
    }

    .param-label-text {
      position: relative;
      display: inline-block;
    }

    .param-footnote-ref {
      position: absolute;
      left: calc(100% + 2px);
      top: -4px;
      color: var(--muted);
      opacity: 0.85;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .param-footnote-ref[hidden] {
      display: none;
    }

    .brand-name {
      margin: 0;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .brand-name a {
      color: inherit;
      text-decoration: none;
    }

    .brand-caption {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 450;
      letter-spacing: -0.005em;
    }

    .brand-credit {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 450;
      line-height: 1;
      white-space: nowrap;
      opacity: 0.75;
    }

    .brand-author-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
      flex-shrink: 0;
    }

    .brand-author-link:focus-visible {
      outline: 2px solid var(--muted);
      outline-offset: 2px;
    }

    .brand-author-link img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(1);
    }


    .header-controls {
      display: flex;
      min-width: 0;
      flex: 0 1 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
    }

    .curve-controls {
      display: grid;
      min-width: 0;
      width: clamp(560px, 44vw, 720px);
      flex: 0 1 auto;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      align-items: stretch;
      gap: 20px;
    }

    .curve-control {
      display: grid;
      min-width: 0;
      grid-template-rows: 24px 39px;
      justify-items: center;
      align-items: end;
      gap: 6px;
    }

    .curve-control label,
    .subdivision-heading {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 24px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
    }

    .subdivision-heading {
      min-height: 0;
      align-items: center;
      gap: 5px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      transition: opacity .15s, color .15s;
    }

    .subdiv-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 11px;
      flex: 0 0 auto;
    }

    .subdiv-check svg {
      display: block;
      width: 16px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .subdiv-check .subdiv-x {
      opacity: 0;
      stroke-linecap: round;
    }

    .subdivision-heading[aria-pressed="true"] .subdiv-check .subdiv-x {
      opacity: 1;
    }

    .subdivision-heading:hover {
      color: var(--ink);
    }

    .subdivision-heading[aria-pressed="false"] {
      opacity: .56;
    }

    .subdivision-heading[aria-pressed="false"] .subdiv-label {
      text-decoration: line-through;
    }

    .subdivision-heading[aria-pressed="true"] {
      color: var(--ink);
    }

    .subdivision-control:has(.subdivision-heading[aria-pressed="false"]) #subdivisions,
    .subdivision-control:has(.subdivision-heading[aria-pressed="false"]) #subdivisions-value {
      opacity: .38;
    }

    .curvature-line {
      position: relative;
      display: flex;
      width: 100%;
      height: 39px;
      align-items: flex-start;
      justify-content: center;
    }

    .curvature-line input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }

    .curvature-line input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: var(--slider-track);
    }

    .curvature-line input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: var(--slider-track);
    }

    #freshness-days::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #4fae6c 0%, #e5be48 52%, #dc5d55 100%);
    }

    #freshness-days::-moz-range-track {
      background: linear-gradient(90deg, #4fae6c 0%, #e5be48 52%, #dc5d55 100%);
    }

    #terminal-days::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #dc5d55 0%, #e5be48 48%, #4fae6c 100%);
    }

    #terminal-days::-moz-range-track {
      background: linear-gradient(90deg, #dc5d55 0%, #e5be48 48%, #4fae6c 100%);
    }

    .curvature-line input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -5px;
      border-radius: 50%;
      background: var(--slider-thumb);
      border: 2px solid var(--slider-ring);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .28);
      transition: transform .12s, background-color .15s;
    }

    .curvature-line input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--slider-thumb);
      border: 2px solid var(--slider-ring);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .28);
      box-sizing: border-box;
      transition: transform .12s, background-color .15s;
    }

    .curvature-line input[type="range"]:hover::-webkit-slider-thumb,
    .curvature-line input[type="range"]:focus-visible::-webkit-slider-thumb {
      background: var(--slider-thumb-hover);
      transform: scale(1.06);
    }

    .curvature-line input[type="range"]:hover::-moz-range-thumb,
    .curvature-line input[type="range"]:focus-visible::-moz-range-thumb {
      background: var(--slider-thumb-hover);
      transform: scale(1.06);
    }

    .curvature-value {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      white-space: nowrap;
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      pointer-events: none;
    }



    .range-switch {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 3px;
      padding: 4px 10px 4px 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
    }

    .range-switch button {
      padding: 6px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .range-switch button:hover {
      color: var(--ink);
    }

    .range-switch button[aria-pressed="true"] {
      background: var(--neutral-soft);
      color: var(--ink);
    }

    .range-unit {
      padding-left: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .layout {
      display: grid;
      min-height: 0;
      flex: 1;
      grid-template-columns: minmax(340px, 390px) minmax(0, 1fr);
      align-items: stretch;
      gap: 21px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .products {
      display: flex;
      min-height: 0;
      flex-direction: column;
      padding: 15px;
    }

    .section-heading {
      display: none;
    }

    .product-toolbar {
      display: grid;
      flex: 0 0 auto;
      width: 100%;
      grid-template-columns: 33px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      padding-right: 6px;
    }

    .product-toolbar .reset-storage,
    .product-toolbar .preset-select,
    .product-toolbar .add-product {
      height: 33px;
      border: 1px solid var(--line);
      border-radius: var(--radius-ctrl);
      background: var(--paper);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      transition: border-color .15s, color .15s, background .15s;
    }

    .reset-storage {
      display: grid;
      width: 33px;
      place-items: center;
      padding: 0;
      color: var(--muted);
      cursor: pointer;
    }

    .reset-storage svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .preset-select {
      width: 100%;
      min-width: 0;
      padding: 0 10px;
      cursor: pointer;
    }

    .add-product {
      padding: 0 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .product-toolbar .reset-storage:hover,
    .product-toolbar .preset-select:hover,
    .product-toolbar .add-product:hover {
      border-color: var(--muted);
      color: var(--ink);
      background: var(--canvas);
    }

    .product-list {
      display: grid;
      min-height: 0;
      flex: 1;
      align-content: start;
      gap: 9px;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-color: var(--scrollbar-thumb) transparent;
      scrollbar-width: thin;
    }

    .product-card {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 118px;
      align-items: stretch;
      gap: 9px;
      padding: 9px;
      border: 1.5px solid color-mix(in srgb, var(--product-color), var(--line) 38%);
      border-radius: var(--radius-card);
      background: color-mix(in srgb, var(--product-color), var(--paper) 86%);
      transition: border-color .18s, background .18s, opacity .18s;
    }

    .product-card[draggable="true"] {
      cursor: grab;
    }

    .product-card.is-dragging {
      cursor: grabbing;
      opacity: .35;
    }

    .product-card.is-drop-target {
      outline: 2px dashed var(--product-color);
      outline-offset: 2px;
    }

    .product-card.is-hidden {
      opacity: .5;
    }

    .product-card.is-active,
    .product-card.is-hovered {
      border-color: var(--product-color);
      background: color-mix(in srgb, var(--product-color), var(--paper) 78%);
    }

    @media (prefers-color-scheme: dark) {
      .product-card {
        background: color-mix(in srgb, var(--product-color), var(--paper) 88%);
      }

      .product-card.is-active,
      .product-card.is-hovered {
        background: color-mix(in srgb, var(--product-color), var(--paper) 80%);
      }
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .item-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      line-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }

    .item-action:hover {
      border-color: var(--muted);
      color: var(--ink);
    }

    .item-action[data-action="delete"]:hover {
      border-color: #d45d5d;
      color: #c54848;
    }

    .item-action svg {
      display: block;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .product-top {
      display: flex;
      min-width: 0;
      align-self: stretch;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .product-title {
      display: grid;
      width: 100%;
      height: 100%;
      min-width: 0;
      grid-template-rows: repeat(3, 30px);
      gap: 4px;
      align-items: center;
      justify-items: center;
    }

    .product-name {
      display: block;
      align-self: end;
      max-width: 100%;
      overflow: hidden;
      padding-bottom: 1px;
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.015em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-unit {
      display: block;
      align-self: start;
      max-width: 100%;
      overflow: hidden;
      padding-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-title.is-editing .product-name,
    .product-title.is-editing .product-unit {
      min-height: 1.35em;
      padding: 2px 6px;
      border-radius: 6px;
      outline: 1px solid color-mix(in srgb, var(--product-color), transparent 35%);
      background: var(--paper);
      cursor: text;
    }

    .product-title.is-editing .product-name:focus,

    .list-menu-item svg {

    .color-swatch {

      padding: 0;
      border: 0;

    .fields {

    .field {

    }

    .input-wrap {

      .product-card {

      .chart-legend {

      .legend-item {

      }

  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-identity">
          <p class="brand-name"><a href="https://thalescatao.github.io/" target="_blank" rel="noopener">Produto Fresco</a></p>

        <div class="brand-footnotes" id="param-footnotes" aria-live="polite">
          <p class="brand-footnote-item is-hidden" id="footnote-slot-1">1 - Indicado para produtos de validade mais longa.</p>
          <p class="brand-footnote-item is-hidden" id="footnote-slot-2">2 - Use o preço de custo como mínimo e mais subdivisões.</p>
        </div>
      </div>
      <div class="header-controls">
        <div class="curve-controls">
          <div class="curve-control">
            <label for="freshness-days"><span class="param-label-text">Período de frescor<sup class="param-footnote-ref" id="freshness-footnote-ref" hidden>1</sup></span></label>
            <div class="curvature-line"><input id="freshness-days" type="range" min="20" max="50" step="1" value="25" aria-label="Percentual da validade em que o preço permanece no máximo após a produção"><span class="curvature-value" id="freshness-days-value">25%</span></div>
          </div>
          <div class="curve-control">
            <label for="terminal-days"><span class="param-label-text">Prazo final de venda<sup class="param-footnote-ref" id="terminal-footnote-ref" hidden>2</sup></span></label>
            <div class="curvature-line"><input id="terminal-days" type="range" min="0" max="33" step="1" value="30" aria-label="Percentual final da validade em que o preço permanece no mínimo"><span class="curvature-value" id="terminal-days-value">30%</span></div>
          </div>
          <div class="curve-control curvature-control">
            <label for="curvature">Fator de curvatura</label>
            <div class="curvature-line"><input id="curvature" type="range" min="1" max="2" step="0.1" value="1.5"
                aria-label="Fator de curvatura da queda de preço"><span class="curvature-value"
                id="curvature-value">1,5</span></div>
          </div>
          <div class="curve-control curvature-control subdivision-control">
            <button class="subdivision-heading" id="subdivisions-enabled" type="button" aria-pressed="false"><span class="subdiv-check" aria-hidden="true"><svg viewBox="0 0 16 11"><path d="M4.2 1.2H1.4v8.6h2.8M11.8 1.2h2.8v8.6h-2.8"/><path class="subdiv-x" d="M6 3.5l4 4m0-4-4 4"/></svg></span><span class="subdiv-label">Subdivisões</span></button>
            <div class="curvature-line"><input id="subdivisions" type="range" min="1" max="5" step="1" value="3"
                aria-label="Número de patamares de preço entre o prazo de frescor e o prazo terminal de venda"><span class="curvature-value"
                id="subdivisions-value">3</span></div>

        <div class="range-switch" role="group" aria-label="Período do gráfico">

          <button type="button" data-range="60" aria-pressed="false">60</button>
          <button type="button" data-range="90" aria-pressed="false">90</button>

        </div>
      </div>
    </header>
    <div class="layout">
      <aside class="panel products" aria-labelledby="products-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Sua lista</p>
            <h1 id="products-title">Alimentos frescos</h1>
          </div>
          <span class="count">6 itens</span>
        </div>
        <div class="product-toolbar"><button id="list-menu-btn" type="button" class="reset-storage" aria-label="Gerenciar listas" aria-haspopup="menu" aria-expanded="false" title="Gerenciar listas"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.4" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10" r="1.4" fill="currentColor" stroke="none"/></svg></button><select id="preset-select" class="preset-select" aria-label="Lista ativa"></select><button id="add-product" type="button" class="add-product">Adicionar Item</button><input id="import-lists-input" type="file" accept=".json,application/json" hidden></div>

            <span class="brand-credit">by <a class="brand-author-link" href="https://thalescatao.github.io/" target="_blank" rel="noopener" aria-label="Thales Catão — site principal" title="Thales Catão"><img src="https://thalescatao.github.io/favicon/favicon.svg" alt="Thales Catão" width="24" height="24"></a></span>

  <div class="color-popover" id="color-popover" role="radiogroup" aria-label="Escolher cor do item"></div>
  <div class="list-menu-popover" id="list-menu-popover" role="menu" aria-label="Opções da lista"></div>
  <script>
    const defaults = [
      { name: 'Ovos brancos', unit: 'bandeja · 30 unidades', max: 19.90, min: 12.90, shelf: 30, color: '#c03939' },
      { name: 'Ovos vermelhos', unit: 'bandeja · 30 unidades', max: 24.90, min: 14.90, shelf: 30, color: '#ee7820' },
      { name: 'Ovos caipiras', unit: 'bandeja · 20 unidades', max: 29.90, min: 16.90, shelf: 30, color: '#e3b519' },
      { name: 'Leite fresco', unit: 'garrafa · 1 litro', max: 9.90, min: 4.90, shelf: 30, color: '#39b35b' },
      { name: 'Creme de leite fresco', unit: 'garrafa · 500 ml', max: 29.00, min: 15.90, shelf: 30, color: '#1d838e' },
      { name: 'Carne bovina resfriada', unit: 'bandeja · 1 kg', max: 39.90, min: 29.90, shelf: 30, color: '#325aa8' },
      { name: 'Carne suína resfriada', unit: 'bandeja · 1 kg', max: 24.90, min: 18.90, shelf: 30, color: '#733eb5' }
    ];
    const storageKey = 'produto-fresco-itens-v1';
    const presetKey = 'produto-fresco-preset-v1';
    const curveSettingsKey = 'produto-fresco-curva-v1';
    let savedCurveSettings = {};
    try { savedCurveSettings = JSON.parse(localStorage.getItem(curveSettingsKey) || '{}') || {}; } catch (_) {}
    const colorSwatches = [
      { hex: '#e77e89', label: 'Rosa' },
      { hex: '#ee7820', label: 'Laranja' },
      { hex: '#e3b519', label: 'Amarelo' },
      { hex: '#39b35b', label: 'Verde' },
      { hex: '#6daae8', label: 'Azul celeste' },
      { hex: '#f056b3', label: 'Magenta' },
      { hex: '#cac4bc', label: 'Cinza claro' },
      { hex: '#a09a92', label: 'Cinza médio claro' },
      { hex: '#c03939', label: 'Vermelho' },
      { hex: '#8f4f2c', label: 'Terracota' },
      { hex: '#627a2c', label: 'Verde-oliva' },
      { hex: '#1d838e', label: 'Ciano' },
      { hex: '#325aa8', label: 'Azul cobalto' },
      { hex: '#733eb5', label: 'Roxo' },
      { hex: '#736e68', label: 'Cinza médio' },
      { hex: '#474440', label: 'Grafite' }
    ];
    const palette = colorSwatches.map(item => item.hex);
    function snapToSwatch(hex) {
      if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return null;
      const lower = hex.toLowerCase();
      if (palette.includes(lower)) return lower;
      const toRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      const [r1, g1, b1] = toRgb(lower);
      let best = palette[0], bestDist = Infinity;
      for (const candidate of palette) {
        const [r2, g2, b2] = toRgb(candidate);
        const dist = (r1 - r2) ** 2 + (g1 - g2) ** 2 + (b1 - b2) ** 2;
        if (dist < bestDist) { bestDist = dist; best = candidate; }
      }
      return best;
    }
    const presetProducts = {
      geral: defaults,

    function resolveCurveDays(product, params) {
      const fPct = Number.isFinite(params.freshnessPct)
        ? params.freshnessPct
        : Number.isFinite(params.freshnessDays)
          ? (params.freshnessDays / Math.max(1, product.shelf)) * 100
          : freshnessPct;
      const tPct = Number.isFinite(params.terminalPct)
        ? params.terminalPct
        : Number.isFinite(params.terminalDays)
          ? (params.terminalDays / Math.max(1, product.shelf)) * 100
          : terminalPct;
      const freshnessDay = Math.round(product.shelf * (fPct / 100));
      const terminalDaysCount = Math.round(product.shelf * (tPct / 100));
      const targetDay = Math.max(0, product.shelf - terminalDaysCount);
      return { freshnessDay, targetDay };
    }

    function commercialRound(value, minPrice, maxPrice) {
      const low = Math.min(minPrice, maxPrice);
      const high = Math.max(minPrice, maxPrice);
      const spread = high - low;
      if (spread <= 0.01) return Math.round(low * 100) / 100;

      const minTenths = Math.floor(low * 10 + 1e-6) + 1;
      const maxTenths = Math.ceil(high * 10 - 1e-6) - 1;
      const targetTenths = Math.round(value * 10);

      if (minTenths <= maxTenths) {
        const clampedTenths = Math.min(maxTenths, Math.max(minTenths, targetTenths));
        return Math.round(clampedTenths * 10) / 100;
      }

      const rounded = targetTenths / 10;
      return Math.round(Math.min(high, Math.max(low, rounded)) * 100) / 100;
    }

    function logarithmicBoundaries(curveStart, targetDay, count) {
      const startDay = Math.round(curveStart);
      const endDay = Math.round(targetDay);
      const totalDays = endDay - startDay;
      if (totalDays <= 0) return [];
      const steps = Math.min(count, totalDays);
      // Progressão logarítmica/geométrica independente da curvatura:
      // cada degrau reduz proporcionalmente (~68% do anterior) do fim do frescor até o prazo final
      const decayRatio = 0.68;
      const weights = Array.from({ length: steps }, (_, index) => Math.pow(decayRatio, index));
      const weightSum = weights.reduce((sum, w) => sum + w, 0);
      const rawWidths = weights.map(w => (w / weightSum) * totalDays);
      const widths = rawWidths.map(w => Math.max(1, Math.floor(w)));
      let diff = totalDays - widths.reduce((sum, w) => sum + w, 0);
      if (diff > 0) {
        const order = rawWidths
          .map((w, index) => ({ index, rem: w - widths[index] }))
          .sort((a, b) => b.rem - a.rem || a.index - b.index);
        for (let i = 0; i < diff; i++) widths[order[i % order.length].index] += 1;
      } else if (diff < 0) {
        for (let i = steps - 1; i >= 0 && diff < 0; i--) {
          const take = Math.min(widths[i] - 1, -diff);
          widths[i] -= take;
          diff += take;
        }
      }
      widths.sort((a, b) => b - a);
      const boundaries = [startDay];
      for (const width of widths) boundaries.push(boundaries[boundaries.length - 1] + width);
      return boundaries;
    }

    function priceAt(product, day) {
      if (day > product.shelf) return null;
      const params = product.curveParams || { freshnessPct, terminalPct, curvature };
      const { freshnessDay, targetDay } = resolveCurveDays(product, params);
      if (targetDay === 0) return product.min;
      if (targetDay > freshnessDay && day <= freshnessDay) return product.max;
      const curveStart = targetDay > freshnessDay ? freshnessDay : 0;
      const progress = Math.min(1, Math.max(0, (day - curveStart) / Math.max(0.01, targetDay - curveStart)));
      const curvedProgress = Math.pow(progress, params.curvature);
      return product.max - (product.max - product.min) * curvedProgress;
    }

    function priceSegments(product) {
      const params = product.curveParams || { freshnessPct, terminalPct, curvature, subdivisions, subdivisionsEnabled };
      const { freshnessDay, targetDay } = resolveCurveDays(product, params);
      const curveStart = targetDay > freshnessDay ? freshnessDay : 0;
      if (targetDay <= curveStart) return [];
      const boundaries = logarithmicBoundaries(curveStart, targetDay, params.subdivisions);
      if (boundaries.length < 2) return [];
      const count = boundaries.length - 1;
      const segments = [];
      for (let index = 0; index < count; index++) {
        const start = boundaries[index];
        const end = boundaries[index + 1];
        if (end <= start) continue;
        let total = 0;
        for (let day = start; day < end; day++) total += priceAt(product, day + 0.5);
        let price = commercialRound(total / (end - start), product.min, product.max);
        if (segments.length && price > segments[segments.length - 1].price) {
          price = segments[segments.length - 1].price;
        }
        segments.push({ start, end, price });
      }
      return segments;
    }

    function usesSubdivisions(product) {
      return product.curveParams ? product.curveParams.subdivisionsEnabled === true : subdivisionsEnabled;
    }

    function drawChart() {
      const productSignature = products.map(product => `${product.name}:${product.shelf}`).join('|');
      const requiredDays = Math.max(0, ...products.map(product => product.shelf));
      const fittingRange = requiredDays > 60 ? 90 : requiredDays > 30 ? 60 : 30;
      if (productSignature !== rangeProductSignature) {
        rangeProductSignature = productSignature;
        maxDays = fittingRange;
        document.querySelectorAll('[data-range]').forEach(button =>
          button.setAttribute('aria-pressed', String(Number(button.dataset.range) === maxDays)));
      }
      const bounds = wrap.getBoundingClientRect();
      const width = Math.max(280, bounds.width);
      const height = Math.max(300, bounds.height);
      const mobile = width < 500;
      const pad = { top: 15, right: mobile ? 18 : 27, bottom: mobileRangeQuery.matches ? 26 : (mobile ? 45 : 48), left: mobile ? 51 : 60 };
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const axisFont = mobile ? 11 : 12;
      const values = products.length ? products.flatMap(product => [product.max, product.min]) : [0, 1];
      const minValue = Math.max(0, Math.floor(Math.min(...values) / 10) * 10);
      const maxValue = Math.ceil(Math.max(...values) / 10) * 10;
      const x = day => pad.left + day / maxDays * innerW;
      const y = value => pad.top + (maxValue - value) / (maxValue - minValue || 1) * innerH;
      const moneyTick = value => `R$ ${Math.round(value)}`;
      let markup = '';

      for (let value = minValue; value <= maxValue; value += 1) {
        if (value % 10 === 0) continue;
        const isFive = value % 5 === 0;
        const yy = y(value);
        markup += `<line x1="${pad.left}" y1="${yy}" x2="${width - pad.right}" y2="${yy}" stroke="var(--chart-grid)" stroke-width="${isFive ? 0.8 : 0.55}" style="opacity:var(${isFive ? '--chart-grid-mid-opacity' : '--chart-grid-minor-opacity'})"/>`;
      }

      for (let value = minValue; value <= maxValue; value += 10) {
        const yy = y(value);
        markup += `<line x1="${pad.left}" y1="${yy}" x2="${width - pad.right}" y2="${yy}" stroke="var(--chart-grid)" stroke-width="1"/>`;
        markup += `<text x="${pad.left - 12}" y="${yy + 4}" fill="var(--chart-muted)" font-size="${axisFont}" text-anchor="end">${moneyTick(value)}</text>`;
      }
      const tickStep = maxDays === 30 ? 5 : 10;
      for (let day = 0; day <= maxDays; day += tickStep) {
        const xx = x(day);
        markup += `<line x1="${xx}" y1="${pad.top}" x2="${xx}" y2="${height - pad.bottom}" stroke="var(--chart-grid)" stroke-width="1"/>`;
        markup += `<text x="${xx}" y="${height - pad.bottom + 18}" fill="var(--chart-muted)" font-size="${axisFont}" text-anchor="middle">${day}</text>`;
      }
      if (!mobileRangeQuery.matches) {
        markup += `<text x="${pad.left + innerW / 2}" y="${height - 8}" fill="var(--chart-muted)" font-size="${axisFont}" font-weight="500" text-anchor="middle">Dias desde a produção</text>`;
      }

      products.forEach((product, index) => {
        if (!visible[index]) return;
        const focusIndex = hovered === null ? selected : hovered;
        const hasFocus = focusIndex !== null;
        const emphasized = index === focusIndex;
        const endDay = Math.min(maxDays, product.shelf);
        let path = '';
        const segments = usesSubdivisions(product) ? priceSegments(product) : [];
        if (segments.length) {
          path = `M${x(0).toFixed(2)},${y(product.max).toFixed(2)} L${x(segments[0].start).toFixed(2)},${y(product.max).toFixed(2)} `;
          segments.forEach((segment, index) => {
            path += `L${x(segment.start).toFixed(2)},${y(segment.price).toFixed(2)} L${x(segment.end).toFixed(2)},${y(segment.price).toFixed(2)} `;
            if (index < segments.length - 1) path += `L${x(segment.end).toFixed(2)},${y(segments[index + 1].price).toFixed(2)} `;
          });
          const lastEnd = segments[segments.length - 1].end;
          if (lastEnd < endDay) path += `L${x(lastEnd).toFixed(2)},${y(product.min).toFixed(2)} L${x(endDay).toFixed(2)},${y(product.min).toFixed(2)} `;
        } else {
          const params = product.curveParams || { freshnessPct, terminalPct, curvature };
          const { freshnessDay, targetDay } = resolveCurveDays(product, params);
          const curveStart = targetDay > freshnessDay ? freshnessDay : 0;
          const clampedStart = Math.min(endDay, Math.max(0, curveStart));
          const clampedEnd = Math.min(endDay, Math.max(clampedStart, targetDay));
          path = `M${x(0).toFixed(2)},${y(priceAt(product, 0)).toFixed(2)} `;
          if (clampedStart > 0) {
            path += `L${x(clampedStart).toFixed(2)},${y(product.max).toFixed(2)} `;
          }
          if (clampedEnd > clampedStart) {
            const curveSamples = 48;
            for (let point = 1; point <= curveSamples; point++) {
              const day = clampedStart + (clampedEnd - clampedStart) * (point / curveSamples);
              path += `L${x(day).toFixed(2)},${y(priceAt(product, day)).toFixed(2)} `;
            }
          }
          if (clampedEnd < endDay) {
            path += `L${x(endDay).toFixed(2)},${y(product.min).toFixed(2)} `;
          }
        }
        markup += `<path data-product="${index}" d="${path}" fill="none" stroke="${product.color}" stroke-width="${hasFocus ? (emphasized ? 3.8 : 2.1) : 2.2}" stroke-linecap="round" stroke-linejoin="round" opacity="${hasFocus ? (emphasized ? 1 : .22) : .77}"/>`;
        if (product.shelf <= maxDays) markup += `<circle data-product="${index}" cx="${x(product.shelf)}" cy="${y(priceAt(product, product.shelf))}" r="3.1" fill="var(--paper)" stroke="${product.color}" stroke-width="2" opacity="${hasFocus ? (emphasized ? 1 : .22) : .77}"/>`;
      });
      chart.setAttribute('viewBox', `0 0 ${width} ${height}`);
      chart.innerHTML = markup;
      chart.querySelectorAll('[data-product]').forEach(path => path.addEventListener('mouseenter', () => {
        const index = Number(path.dataset.product);
        if (hovered !== index) { hovered = index; drawChart(); }
      }));
      chart.querySelectorAll('[data-product]').forEach(line => line.addEventListener('click', event => {
        event.stopPropagation();
        selected = Number(line.dataset.product);
        hovered = null;
        drawChart();
      }));
      updateProductPanel();
    }

    wrap.addEventListener('mousemove', event => {
      if (!products.length) { tooltip.style.display = "none"; return; }
      const box = wrap.getBoundingClientRect();
      const width = box.width;
      const height = box.height;
      const padLeft = width < 500 ? 51 : 60;
      const padRight = width < 500 ? 18 : 27;
      const day = Math.max(0, Math.min(maxDays, (event.clientX - box.left - padLeft) / (width - padLeft - padRight) * maxDays));
      const chartTop = 15;
      const chartBottom = width < 500 ? 45 : 48;
      const values = products.length ? products.flatMap(product => [product.max, product.min]) : [0, 1];
      const minValue = Math.max(0, Math.floor(Math.min(...values) / 10) * 10);
      const maxValue = Math.ceil(Math.max(...values) / 10) * 10;
      const plotHeight = height - chartTop - chartBottom;
      let closest = null;
      let closestDistance = 15;
      products.forEach((product, index) => {
        if (!visible[index]) return;
        const rawPrice = priceAt(product, day);
        if (rawPrice === null) return;
        const params = product.curveParams || { freshnessPct, terminalPct };
        const { targetDay } = resolveCurveDays(product, params);
        const hasSubdivisions = usesSubdivisions(product);
        const segments = hasSubdivisions ? priceSegments(product) : [];
        const segment = segments.find(item => day >= item.start && day < item.end);
        const terminalStart = segments.length ? segments[segments.length - 1].end : targetDay;
        const price = hasSubdivisions && day >= terminalStart
          ? product.min
          : hasSubdivisions && segment
            ? segment.price
            : rawPrice;
        const lineY = chartTop + (maxValue - price) / (maxValue - minValue || 1) * plotHeight;
        const distance = Math.abs(event.clientY - box.top - lineY);
        if (distance < closestDistance) { closest = index; closestDistance = distance; }
      });
      if (hovered !== closest) { hovered = closest; drawChart(); }
      updateProductPanel();
      const wholeDay = Math.round(day);
      const active = products.map((product, index) => ({ product, index })).filter(({ index }) => visible[index]);
      tooltip.innerHTML = `<strong>Dia ${wholeDay} · preços estimados</strong>` + active.map(({ product, index }) => {
        const hasSubdivisions = usesSubdivisions(product);
        const segments = hasSubdivisions ? priceSegments(product) : [];
        const segment = segments.find(item => wholeDay >= item.start && wholeDay < item.end);
        const params = product.curveParams || { freshnessPct, terminalPct };
        const { targetDay } = resolveCurveDays(product, params);
        const terminalStart = segments.length ? segments[segments.length - 1].end : targetDay;
        const price = hasSubdivisions && wholeDay >= terminalStart && wholeDay <= product.shelf
          ? product.min
          : hasSubdivisions && segment
            ? segment.price
            : priceAt(product, wholeDay);
        const focusClass = hovered === index ? ' is-highlighted' : hovered !== null ? ' is-dimmed' : '';
        return `<span class="tooltip-row${focusClass}"><i style="background:${product.color}"></i>${escapeHtml(product.name)}: <b>${price === null ? 'fora do prazo' : money(price)}</b></span>`;
      }).join('');
      tooltip.style.display = 'block';
      const tipW = tooltip.offsetWidth || 210;
      const tipH = tooltip.offsetHeight || 160;
      const cursorX = event.clientX - box.left;
      const cursorY = event.clientY - box.top;
      const leftPos = cursorX + 16 + tipW <= width - 8 ? cursorX + 16 : Math.max(8, cursorX - tipW - 16);
      const topPos = Math.min(Math.max(6, cursorY - 18), Math.max(6, height - tipH - 6));
      tooltip.style.left = `${leftPos}px`;
      tooltip.style.top = `${topPos}px`;
    });
    wrap.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; if (hovered !== null) { hovered = null; drawChart(); } else updateProductPanel(); });
    document.addEventListener('click', event => {
      if (event.target.closest('.product-card, [data-product], #color-popover')) return;
      if (selected !== null || hovered !== null) {
        selected = null;
        hovered = null;
        list.querySelectorAll('.product-card').forEach(card => card.classList.remove('is-active'));
        drawChart();
      }
    });
    document.querySelectorAll('[data-range]').forEach(button => button.addEventListener('click', () => {
      maxDays = Number(button.dataset.range);
      document.querySelectorAll('[data-range]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      drawChart();
    }));
    const terminalDaysSlider = document.querySelector('#terminal-days');
    const terminalDaysValueDisplay = document.querySelector('#terminal-days-value');
    const freshnessDaysSlider = document.querySelector('#freshness-days');
    const freshnessDaysValueDisplay = document.querySelector('#freshness-days-value');
    const curvatureSlider = document.querySelector('#curvature');
    const curvatureValueDisplay = document.querySelector('#curvature-value');
    const subdivisionsSlider = document.querySelector('#subdivisions');
    const subdivisionsValueDisplay = document.querySelector('#subdivisions-value');
    const subdivisionsToggle = document.querySelector('#subdivisions-enabled');

    function positionSliderValue(slider, display) {
      const min = Number(slider.min);
      const max = Number(slider.max);
      const ratio = max === min ? 0 : (Number(slider.value) - min) / (max - min);
      const lineRect = slider.parentElement.getBoundingClientRect();
      const sliderRect = slider.getBoundingClientRect();
      const thumbSize = 16;
      const thumbCenter = sliderRect.left - lineRect.left + thumbSize / 2 + Math.max(0, sliderRect.width - thumbSize) * ratio;
      display.style.left = `${thumbCenter}px`;
    }

    function positionAllSliderValues() {
      positionSliderValue(freshnessDaysSlider, freshnessDaysValueDisplay);
      positionSliderValue(terminalDaysSlider, terminalDaysValueDisplay);
      positionSliderValue(curvatureSlider, curvatureValueDisplay);
      positionSliderValue(subdivisionsSlider, subdivisionsValueDisplay);
    }

    const paramFootnotes = document.querySelector('#param-footnotes');
    const freshnessFootnoteRef = document.querySelector('#freshness-footnote-ref');
    const terminalFootnoteRef = document.querySelector('#terminal-footnote-ref');
    const headerControlsEl = document.querySelector('.header-controls');
    const rangeSwitchEl = document.querySelector('.range-switch');
    const chartRangeSlot = document.querySelector('#chart-range-slot');
    const mobileRangeQuery = window.matchMedia('(max-width: 760px)');

    function syncRangeSwitchPlacement() {
      if (!rangeSwitchEl || !headerControlsEl || !chartRangeSlot) return;
      if (mobileRangeQuery.matches) {
        if (rangeSwitchEl.parentElement !== chartRangeSlot) chartRangeSlot.appendChild(rangeSwitchEl);
      } else if (rangeSwitchEl.parentElement !== headerControlsEl) {
        headerControlsEl.appendChild(rangeSwitchEl);
      }
      requestAnimationFrame(() => {
        positionAllSliderValues();
        if (typeof drawChart === 'function') drawChart();
      });
    }
    syncRangeSwitchPlacement();
    if (typeof mobileRangeQuery.addEventListener === 'function') {
      mobileRangeQuery.addEventListener('change', syncRangeSwitchPlacement);
    } else if (typeof mobileRangeQuery.addListener === 'function') {
      mobileRangeQuery.addListener(syncRangeSwitchPlacement);
    }

    const footnoteSlot1 = document.querySelector('#footnote-slot-1');
    const footnoteSlot2 = document.querySelector('#footnote-slot-2');

    function updateExtremeFootnotes() {
      const showFreshnessNote = freshnessPct === 50;
      const showTerminalNote = terminalPct === 0;
      if (freshnessFootnoteRef) freshnessFootnoteRef.hidden = !showFreshnessNote;
      if (terminalFootnoteRef) terminalFootnoteRef.hidden = !showTerminalNote;
      if (footnoteSlot1) footnoteSlot1.classList.toggle('is-hidden', !showFreshnessNote);
      if (footnoteSlot2) footnoteSlot2.classList.toggle('is-hidden', !showTerminalNote);
    }

    terminalDaysSlider.addEventListener('input', event => {
      terminalPct = Number(event.currentTarget.value);
      terminalDaysValueDisplay.textContent = `${terminalPct}%`;
      positionSliderValue(terminalDaysSlider, terminalDaysValueDisplay);
      updateExtremeFootnotes();
      saveCurveSettings();
      drawChart();
    });
    freshnessDaysSlider.addEventListener('input', event => {
      freshnessPct = Number(event.currentTarget.value);
      freshnessDaysValueDisplay.textContent = `${freshnessPct}%`;
      positionSliderValue(freshnessDaysSlider, freshnessDaysValueDisplay);
      updateExtremeFootnotes();
      saveCurveSettings();
      drawChart();
    });
    curvatureSlider.addEventListener('input', event => {
      curvature = Number(event.currentTarget.value);
      curvatureValueDisplay.textContent = curvature.toFixed(1).replace('.', ',');
      positionSliderValue(curvatureSlider, curvatureValueDisplay);
      saveCurveSettings();
      drawChart();
    });
    subdivisionsSlider.addEventListener('input', event => {
      subdivisions = Number(event.currentTarget.value);
      subdivisionsValueDisplay.textContent = String(subdivisions);
      positionSliderValue(subdivisionsSlider, subdivisionsValueDisplay);
      saveCurveSettings();
      drawChart();
    });
    freshnessDaysSlider.value = String(freshnessPct);
    terminalDaysSlider.value = String(terminalPct);
    curvatureSlider.value = String(curvature);
    subdivisionsSlider.value = String(subdivisions);
    freshnessDaysValueDisplay.textContent = `${freshnessPct}%`;
    terminalDaysValueDisplay.textContent = `${terminalPct}%`;
    updateExtremeFootnotes();
    curvatureValueDisplay.textContent = curvature.toFixed(1).replace('.', ',');
    subdivisionsValueDisplay.textContent = String(subdivisions);
    function updateSubdivisionsToggle() {
      subdivisionsToggle.setAttribute('aria-pressed', String(subdivisionsEnabled));
    }
    updateSubdivisionsToggle();
    subdivisionsToggle.addEventListener('click', () => {
      subdivisionsEnabled = !subdivisionsEnabled;
      updateSubdivisionsToggle();
      saveCurveSettings();
      drawChart();
    });
    window.addEventListener('resize', () => {
      drawChart();
      positionAllSliderValues();
    });
    positionAllSliderValues();
    requestAnimationFrame(positionAllSliderValues);
    renderProducts();
    renderLegend();
    drawChart();
  </script>
</body>

</html>
