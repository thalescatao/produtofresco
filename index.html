<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f4">
  <title>Produto Fresco</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #292929;
      --muted: #777;
      --line: #e2e2e2;
      --paper: #fff;
      --canvas: #f4f4f4;
      --neutral-soft: #ededed;
      --chart-grid: #ebebeb;
      --chart-muted: #858585;
      --shadow: 0 18px 48px rgb(0 0 0 / 7%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ededed;
        --muted: #aaa;
        --line: #3d3d3d;
        --paper: #242424;
        --canvas: #171717;
        --neutral-soft: #373737;
        --chart-grid: #3b3b3b;
        --chart-muted: #aaa;
        --shadow: 0 18px 48px rgb(0 0 0 / 22%);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    .app { display: flex; max-width: 1600px; height: 100vh; min-height: 0; flex-direction: column; margin: 0 auto; padding: 20px 28px; }
    .topbar { display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 20px; margin: 0 0 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 14px; background: #dedede; color: #333; }
    @media (prefers-color-scheme: dark) { .brand-mark { background: #3b3b3b; color: #eee; } }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { margin: 0; font-size: 20px; font-weight: 720; letter-spacing: -.04em; }
    .brand-caption { margin: 1px 0 0; color: var(--muted); font-size: 12px; }
    .header-controls { display: flex; align-items: center; justify-content: flex-end; gap: 28px; }
    .curve-controls { display: flex; align-items: stretch; gap: 24px; }
    .curve-control { display: grid; grid-template-rows: 14px 29px; justify-items: center; gap: 7px; }
    .curve-control label { color: var(--muted); font-size: 10px; font-weight: 650; text-align: center; white-space: nowrap; }
    .terminal-input { display: flex; align-items: center; gap: 5px; }
    .terminal-input input { width: 48px; height: 29px; padding: 0 5px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink); font-size: 11px; }
    .terminal-input span { color: var(--muted); font-size: 10px; }
    .curvature-control { width: 150px; }
    .curvature-line { position: relative; display: flex; width: 100%; height: 29px; align-items: center; justify-content: center; color: var(--muted); font-size: 10px; }
    .curvature-line input { width: 100%; height: 16px; margin: 0; accent-color: #777; }
    .curvature-value { position: absolute; right: -25px; min-width: 23px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .range-switch { display: inline-flex; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
    .range-switch button { padding: 7px 13px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 650; cursor: pointer; }
    .range-switch button[aria-pressed="true"] { background: var(--neutral-soft); color: var(--ink); }
    .layout { display: grid; min-height: 0; flex: 1; grid-template-columns: minmax(310px, 360px) minmax(0, 1fr); align-items: stretch; gap: 20px; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    .products { display: flex; min-height: 0; flex-direction: column; padding: 12px 14px; }
    .section-heading { display: none; }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    .section-heading h1, .chart-heading h2 { margin: 0; font-size: 19px; letter-spacing: -.035em; }
    .count { padding: 4px 8px; border-radius: 20px; background: var(--neutral-soft); color: var(--muted); font-size: 11px; font-weight: 650; }
    .product-list { display: grid; min-height: 0; flex: 1; align-content: start; gap: 8px; overflow-y: auto; padding-right: 4px; scrollbar-color: #aaa transparent; scrollbar-width: thin; }
    .product-card { padding: 8px 10px; border: 2px solid color-mix(in srgb, var(--product-color), var(--line) 35%); border-radius: 13px; background: color-mix(in srgb, var(--product-color), var(--paper) 82%); transition: border-color .18s, background .18s; }
    .product-card.is-active, .product-card.is-hovered { border-color: var(--product-color); background: color-mix(in srgb, var(--product-color), var(--paper) 74%); }
    @media (prefers-color-scheme: dark) {
      .product-card { background: color-mix(in srgb, var(--product-color), var(--paper) 86%); }
      .product-card.is-active, .product-card.is-hovered { background: color-mix(in srgb, var(--product-color), var(--paper) 78%); }
    }
    .product-card { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: center; gap: 10px; }
    .product-top { display: flex; min-width: 0; align-items: flex-start; gap: 9px; }
    .product-title { min-width: 0; flex: 1; }
    .product-name { display: block; overflow: hidden; font-size: 14px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
    .product-unit { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .current-price { display: none; margin-top: 6px; color: var(--product-color); font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .current-price.is-visible { display: block; }
    .fields { display: grid; grid-template-columns: 1fr; gap: 3px; }
    .field { min-width: 0; }
    .field label { display: block; margin: 0 0 4px 1px; color: var(--muted); font-size: 9px; font-weight: 600; white-space: nowrap; }
    .input-wrap { display: flex; align-items: center; min-width: 0; height: 28px; padding: 0 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
    .input-wrap:focus-within { border-color: var(--product-color); box-shadow: 0 0 0 2px color-mix(in srgb, var(--product-color), transparent 84%); }
    .prefix, .suffix { flex: 0 0 auto; color: var(--muted); font-size: 9px; }
    .input-wrap input { width: 100%; min-width: 0; padding: 0 2px; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 11px; font-weight: 650; }
    .input-wrap input::-webkit-inner-spin-button, .input-wrap input::-webkit-outer-spin-button { margin: 0; appearance: none; }
    .input-wrap input[type=number] { appearance: textfield; }
    .chart-panel { display: flex; min-height: 0; flex-direction: column; padding: 20px 26px 16px; }
    .chart-heading { display: flex; align-items: flex-start; justify-content: center; gap: 18px; text-align: center; }
    .chart-heading h2 { font-size: 26px; }
    .chart-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .chart-meta { display: flex; align-items: center; gap: 7px; margin-top: 7px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #929292; box-shadow: 0 0 0 3px var(--neutral-soft); }
    .chart-wrap { position: relative; min-height: 200px; flex: 1; margin-top: 16px; }
    #chart { display: block; width: 100%; height: 100%; overflow: visible; }
    .tooltip { position: absolute; z-index: 2; display: none; min-width: 145px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: 0 8px 25px rgb(0 0 0 / 16%); pointer-events: none; }
    .tooltip strong { display: block; margin-bottom: 5px; font-size: 11px; }
    .tooltip-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .tooltip-row i { width: 7px; height: 7px; border-radius: 50%; }
    .tooltip-row.is-highlighted { color: var(--ink); font-weight: 700; }
    .tooltip-row.is-dimmed { opacity: .38; }
    .chart-legend { display: flex; flex: 0 0 auto; flex-wrap: wrap; gap: 7px 17px; margin: 12px 0 0 54px; }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; padding: 4px 0; border: 0; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; }
    .legend-item[aria-pressed="false"] { opacity: .42; text-decoration: line-through; }
    .legend-line { width: 17px; height: 3px; border-radius: 3px; }
    .chart-note { flex: 0 0 auto; margin: 10px 0 0 54px; color: #89928b; font-size: 10px; }
    @media (prefers-color-scheme: dark) { .chart-note { color: var(--muted); } }
    @media (min-width: 1300px) { .layout { grid-template-columns: 365px minmax(0, 1fr); gap: 24px; } }
    @media (max-width: 850px) {
      .app { height: auto; min-height: 100vh; padding: 20px; }
      .topbar { align-items: flex-start; }
      .header-controls { flex-wrap: wrap; gap: 16px 20px; }
      .curve-controls { gap: 18px; }
      .layout { flex: 0 0 auto; grid-template-columns: 1fr; }
      .products { min-height: 360px; padding: 14px; }
      .product-list { grid-template-columns: 1fr; }
      .chart-panel { min-height: 560px; padding: 22px 19px 18px; }
      .chart-wrap { min-height: 350px; }
    }
    @media (max-width: 560px) {
      .app { padding: 15px 12px 24px; }
      .topbar { align-items: flex-start; margin-bottom: 16px; }
      .header-controls { flex-direction: column; align-items: flex-end; }
      .curve-controls { flex-wrap: wrap; justify-content: flex-end; }
      .curvature-control { width: 145px; }
      .brand-caption { max-width: 160px; }
      .range-switch button { padding: 7px 10px; }
      .product-list { grid-template-columns: 1fr; }
      .product-card { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
      .chart-heading { display: block; }
      .chart-meta { margin-top: 12px; }
      .chart-panel { padding: 19px 13px 16px; }
      .chart-wrap { min-height: 300px; margin-top: 19px; }
      .chart-legend, .chart-note { margin-left: 43px; }
      .chart-legend { gap: 7px 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M19.5 4.5c-7.1.1-12.3 2-13.9 6.7-1.2 3.5 1.4 6.3 4.6 5.4 5.2-1.5 7.8-7.8 9.3-12.1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21c2.5-5.1 6.4-8.7 11.1-11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div><p class="brand-name">Produto Fresco</p><p class="brand-caption">o valor certo, no tempo certo</p></div>
      </div>
      <div class="header-controls">
        <div class="curve-controls">
          <div class="curve-control">
            <label for="freshness-days">Prazo de frescor</label>
            <div class="terminal-input"><input id="freshness-days" type="number" min="0" max="30" step="1" value="3" aria-label="Dias em que o preço permanece no máximo após a produção"><span>dias</span></div>
          </div>
          <div class="curve-control">
            <label for="terminal-days">Prazo terminal de venda</label>
            <div class="terminal-input"><input id="terminal-days" type="number" min="1" max="14" step="1" value="7" aria-label="Dias antes do fim da prateleira para atingir o preço mínimo"><span>dias</span></div>
          </div>
          <div class="curve-control curvature-control">
            <label for="curvature">Fator de curvatura</label>
            <div class="curvature-line"><input id="curvature" type="range" min="1" max="2.5" step="0.1" value="1.5" aria-label="Fator de curvatura da queda de preço"><span class="curvature-value" id="curvature-value">1,5</span></div>
          </div>
        </div>
        <div class="range-switch" role="group" aria-label="Período do gráfico">
          <button type="button" data-range="30" aria-pressed="true">30 dias</button>
          <button type="button" data-range="60" aria-pressed="false">60 dias</button>
        </div>
      </div>
    </header>
    <div class="layout">
      <aside class="panel products" aria-labelledby="products-title">
        <div class="section-heading">
          <div><p class="eyebrow">Sua lista</p><h1 id="products-title">Alimentos frescos</h1></div>
          <span class="count">6 itens</span>
        </div>
        <div id="product-list" class="product-list"></div>
      </aside>
      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="chart-heading">
          <div>
            <h2 id="chart-title">Curva de Preços</h2>
          </div>
        </div>
        <div class="chart-wrap" id="chart-wrap">
          <svg id="chart" role="img" aria-label="Gráfico de curvas de preço dos alimentos frescos"></svg>
          <div class="tooltip" id="tooltip"></div>
        </div>
        <div class="chart-legend" id="chart-legend" aria-label="Produtos no gráfico"></div>
      </section>
    </div>
  </main>
  <script>
    // Edite estes valores para definir os preços e o prazo de cada produto.
    const products = [
      { name: 'Ovos brancos', unit: 'bandeja · 30 unidades', max: 19.90, min: 12.90, shelf: 30, color: '#4e8b65' },
      { name: 'Ovos vermelhos', unit: 'bandeja · 30 unidades', max: 24.90, min: 14.90, shelf: 30, color: '#cb8555' },
      { name: 'Ovos caipiras', unit: 'bandeja · 20 unidades', max: 29.90, min: 16.90, shelf: 30, color: '#a27a44' },
      { name: 'Leite fresco', unit: 'garrafa · 1 litro', max: 12.90, min: 4.90, shelf: 30, color: '#6e8fb2' },
      { name: 'Creme de leite fresco', unit: 'garrafa · 500 ml', max: 29.00, min: 15.90, shelf: 30, color: '#9a82b8' },
      { name: 'Carne bovina resfriada', unit: 'bandeja · 1 kg', max: 39.90, min: 29.90, shelf: 30, color: '#c76e70' },
      { name: 'Carne suína resfriada', unit: 'bandeja · 1 kg', max: 24.90, min: 18.90, shelf: 30, color: '#ad6673' }
    ];

    const list = document.querySelector('#product-list');
    const legend = document.querySelector('#chart-legend');
    const chart = document.querySelector('#chart');
    const wrap = document.querySelector('#chart-wrap');
    const tooltip = document.querySelector('#tooltip');
    let maxDays = 30;
    let freshnessDays = 3;
    let terminalDays = 7;
    let curvature = 1.5;
    let selected = null;
    let hovered = null;
    let hoveredDay = null;
    const visible = products.map(() => true);
    const money = value => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);

    function renderProducts() {
      list.innerHTML = products.map((product, index) => `
        <article class="product-card${index === selected ? ' is-active' : ''}" data-card="${index}" style="--product-color:${product.color}">
          <div class="product-top">
            <span class="product-title"><span class="product-name">${product.name}</span><span class="product-unit">${product.unit}</span><span class="current-price" data-current-price="${index}"></span></span>
          </div>
          <div class="fields">
            <div class="field"><div class="input-wrap"><span class="prefix">R$</span><input id="max-${index}" data-index="${index}" data-key="max" type="number" min="0" step="0.50" value="${product.max.toFixed(2)}" aria-label="Preço máximo de ${product.name}"><span class="suffix">máx</span></div></div>
            <div class="field"><div class="input-wrap"><span class="prefix">R$</span><input id="min-${index}" data-index="${index}" data-key="min" type="number" min="0" step="0.50" value="${product.min.toFixed(2)}" aria-label="Preço mínimo de ${product.name}"><span class="suffix">mín</span></div></div>
            <div class="field"><div class="input-wrap"><input id="shelf-${index}" data-index="${index}" data-key="shelf" type="number" min="1" max="365" step="1" value="${product.shelf}" aria-label="Tempo de prateleira de ${product.name}"><span class="suffix">dias</span></div></div>
          </div>
        </article>`).join('');
      list.querySelectorAll('input').forEach(input => input.addEventListener('input', event => {
        const { index, key } = event.currentTarget.dataset;
        const value = Number(event.currentTarget.value);
        if (Number.isFinite(value) && value >= 0) products[index][key] = key === 'shelf' ? Math.max(1, value) : value;
        drawChart();
      }));
      list.querySelectorAll('.product-card').forEach(card => card.addEventListener('click', () => {
        selected = Number(card.dataset.card);
        hoveredDay = null;
        drawChart();
      }));
    }

    function updateProductPanel() {
      const focusIndex = hovered === null ? selected : hovered;
      list.querySelectorAll('.product-card').forEach((card, index) => {
        card.classList.toggle('is-active', index === selected);
        card.classList.toggle('is-hovered', hovered !== null && index === hovered);
        const priceLabel = card.querySelector('[data-current-price]');
        if (index === focusIndex && hoveredDay !== null) {
          const price = priceAt(products[index], hoveredDay);
          priceLabel.textContent = price === null ? 'Fora do prazo' : `Dia ${Math.round(hoveredDay)} · ${money(price)}`;
          priceLabel.classList.add('is-visible');
        } else {
          priceLabel.textContent = '';
          priceLabel.classList.remove('is-visible');
        }
      });
    }

    function renderLegend() {
      legend.innerHTML = products.map((product, index) => `<button class="legend-item" type="button" data-index="${index}" aria-pressed="true"><span class="legend-line" style="background:${product.color}"></span>${product.name}</button>`).join('');
      legend.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
        const index = Number(button.dataset.index);
        visible[index] = !visible[index];
        button.setAttribute('aria-pressed', String(visible[index]));
        drawChart();
      }));
    }

    function priceAt(product, day) {
      if (day > product.shelf) return null;
      const targetDay = Math.max(0, product.shelf - terminalDays);
      if (targetDay === 0) return product.min;
      if (targetDay > freshnessDays && day <= freshnessDays) return product.max;
      const curveStart = targetDay > freshnessDays ? freshnessDays : 0;
      const progress = Math.min(1, Math.max(0, (day - curveStart) / Math.max(0.01, targetDay - curveStart)));
      const curvedProgress = Math.pow(progress, curvature);
      return product.max - (product.max - product.min) * curvedProgress;
    }

    function drawChart() {
      const bounds = wrap.getBoundingClientRect();
      const width = Math.max(280, bounds.width);
      const height = Math.max(300, bounds.height);
      const mobile = width < 500;
      const pad = { top: 15, right: mobile ? 165 : 195, bottom: 39, left: mobile ? 49 : 61 };
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const values = products.flatMap(product => [product.max, product.min]);
      const minValue = Math.max(0, Math.floor(Math.min(...values) / 10) * 10 - 2);
      const maxValue = Math.ceil(Math.max(...values) / 10) * 10 + 2;
      const x = day => pad.left + day / maxDays * innerW;
      const y = value => pad.top + (maxValue - value) / (maxValue - minValue || 1) * innerH;
      const moneyTick = value => `R$ ${Math.round(value)}`;
      let markup = '';

      for (let i = 0; i <= 4; i++) {
        const value = minValue + (maxValue - minValue) * i / 4;
        const yy = y(value);
        markup += `<line x1="${pad.left}" y1="${yy}" x2="${width - pad.right}" y2="${yy}" stroke="var(--chart-grid)" stroke-width="1"/>`;
        markup += `<text x="${pad.left - 10}" y="${yy + 3.5}" fill="var(--chart-muted)" font-size="10" text-anchor="end">${moneyTick(value)}</text>`;
      }
      const tickStep = maxDays === 30 ? 5 : 10;
      for (let day = 0; day <= maxDays; day += tickStep) {
        const xx = x(day);
        markup += `<line x1="${xx}" y1="${pad.top}" x2="${xx}" y2="${height - pad.bottom}" stroke="var(--chart-grid)" stroke-width="1"/>`;
        markup += `<text x="${xx}" y="${height - 14}" fill="var(--chart-muted)" font-size="10" text-anchor="middle">${day}</text>`;
      }
      markup += `<text x="${x(maxDays) + 8}" y="${height - 14}" fill="var(--chart-muted)" font-size="10" text-anchor="start">Dias desde a produção</text>`;

      products.forEach((product, index) => {
        if (!visible[index]) return;
        const focusIndex = hovered === null ? selected : hovered;
        const hasFocus = focusIndex !== null;
        const emphasized = index === focusIndex;
        const endDay = Math.min(maxDays, product.shelf);
        const samples = Math.max(2, Math.ceil(endDay * 2));
        let path = '';
        for (let point = 0; point <= samples; point++) {
          const day = endDay * point / samples;
          path += `${point === 0 ? 'M' : 'L'}${x(day).toFixed(2)},${y(priceAt(product, day)).toFixed(2)} `;
        }
        markup += `<path data-product="${index}" d="${path}" fill="none" stroke="${product.color}" stroke-width="${hasFocus ? (emphasized ? 3.8 : 2.1) : 2.2}" stroke-linecap="round" stroke-linejoin="round" opacity="${hasFocus ? (emphasized ? 1 : .22) : .77}"/>`;
        if (product.shelf <= maxDays) markup += `<circle data-product="${index}" cx="${x(product.shelf)}" cy="${y(priceAt(product, product.shelf))}" r="3.1" fill="var(--paper)" stroke="${product.color}" stroke-width="2"/>`;
      });
      chart.setAttribute('viewBox', `0 0 ${width} ${height}`);
      chart.innerHTML = markup;
      chart.querySelectorAll('[data-product]').forEach(path => path.addEventListener('mouseenter', () => {
        const index = Number(path.dataset.product);
        if (hovered !== index) { hovered = index; drawChart(); }
      }));
      chart.querySelectorAll('[data-product]').forEach(line => line.addEventListener('click', event => {
        event.stopPropagation();
        selected = Number(line.dataset.product);
        hovered = null;
        drawChart();
      }));
      updateProductPanel();
    }

    wrap.addEventListener('mousemove', event => {
      const box = wrap.getBoundingClientRect();
      const width = box.width;
      const height = box.height;
      const padLeft = width < 500 ? 49 : 61;
      const padRight = width < 500 ? 165 : 195;
      const day = Math.max(0, Math.min(maxDays, (event.clientX - box.left - padLeft) / (width - padLeft - padRight) * maxDays));
      hoveredDay = day;
      const chartTop = 15;
      const chartBottom = 39;
      const values = products.flatMap(product => [product.max, product.min]);
      const minValue = Math.max(0, Math.floor(Math.min(...values) / 10) * 10 - 2);
      const maxValue = Math.ceil(Math.max(...values) / 10) * 10 + 2;
      const plotHeight = height - chartTop - chartBottom;
      let closest = null;
      let closestDistance = 15;
      products.forEach((product, index) => {
        if (!visible[index]) return;
        const price = priceAt(product, day);
        if (price === null) return;
        const lineY = chartTop + (maxValue - price) / (maxValue - minValue || 1) * plotHeight;
        const distance = Math.abs(event.clientY - box.top - lineY);
        if (distance < closestDistance) { closest = index; closestDistance = distance; }
      });
      if (hovered !== closest) { hovered = closest; drawChart(); }
      updateProductPanel();
      const active = products.map((product, index) => ({ product, index })).filter(({ index }) => visible[index]);
      tooltip.innerHTML = `<strong>Dia ${Math.round(day)} · preços estimados</strong>` + active.map(({ product, index }) => {
        const price = priceAt(product, day);
        const focusClass = hovered === index ? ' is-highlighted' : hovered !== null ? ' is-dimmed' : '';
        return `<span class="tooltip-row${focusClass}"><i style="background:${product.color}"></i>${product.name}: <b>${price === null ? 'fora do prazo' : money(price)}</b></span>`;
      }).join('');
      tooltip.style.display = 'block';
      tooltip.style.left = `${Math.min(Math.max(8, event.clientX - box.left + 13), width - 180)}px`;
      tooltip.style.top = `${Math.max(4, event.clientY - box.top - 18)}px`;
    });
    wrap.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; if (hovered !== null) { hovered = null; drawChart(); } else updateProductPanel(); });
    document.addEventListener('click', event => {
      if (event.target.closest('.product-card, [data-product]')) return;
      if (selected !== null || hovered !== null) {
        selected = null;
        hovered = null;
        hoveredDay = null;
        list.querySelectorAll('.product-card').forEach(card => card.classList.remove('is-active'));
        drawChart();
      }
    });
    document.querySelectorAll('[data-range]').forEach(button => button.addEventListener('click', () => {
      maxDays = Number(button.dataset.range);
      document.querySelectorAll('[data-range]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      drawChart();
    }));
    document.querySelector('#terminal-days').addEventListener('input', event => {
      const value = Number(event.currentTarget.value);
      if (Number.isFinite(value) && value >= 1) {
        terminalDays = Math.min(14, Math.round(value));
        drawChart();
      }
    });
    document.querySelector('#freshness-days').addEventListener('input', event => {
      const value = Number(event.currentTarget.value);
      if (Number.isFinite(value) && value >= 0) {
        freshnessDays = Math.min(30, Math.round(value));
        drawChart();
      }
    });
    document.querySelector('#curvature').addEventListener('input', event => {
      curvature = Number(event.currentTarget.value);
      document.querySelector('#curvature-value').textContent = curvature.toFixed(1).replace('.', ',');
      drawChart();
    });
    window.addEventListener('resize', drawChart);
    renderProducts();
    renderLegend();
    drawChart();
  </script>
</body>
</html>
