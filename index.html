<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f4">
  <title>Produto Fresco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
      --ink: #222222;
      --muted: #6e6e6e;
      --line: #e4e4e4;
      --paper: #ffffff;
      --canvas: #f5f5f4;
      --neutral-soft: #ededeb;
      --chart-grid: #ececea;
      --chart-muted: #787878;
      --shadow: 0 12px 36px rgb(0 0 0 / 5%);
      --radius-panel: 18px;
      --radius-card: 12px;
      --radius-ctrl: 9px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f0f0f0;
        --muted: #a3a3a3;
        --line: #383838;
        --paper: #222222;
        --canvas: #161616;
        --neutral-soft: #333333;
        --chart-grid: #343434;
        --chart-muted: #9e9e9e;
        --shadow: 0 16px 42px rgb(0 0 0 / 26%);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font: 400 15px/1.45 var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    .app {
      display: flex;
      max-width: 1560px;
      height: 100vh;
      min-height: 0;
      flex-direction: column;
      margin: 0 auto;
      padding: 21px 27px;
      gap: 18px;
    }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      min-width: max-content;
    }

    .brand-name {
      margin: 0;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .brand-caption {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 450;
      letter-spacing: -0.005em;
    }

    .header-controls {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 24px;
    }

    .curve-controls {
      display: grid;
      min-width: 0;
      flex: 0 1 648px;
      grid-template-columns: repeat(4, minmax(112px, 1fr));
      align-items: stretch;
      gap: 18px;
    }

    .curve-control {
      display: grid;
      min-width: 0;
      grid-template-rows: 24px 39px;
      justify-items: center;
      align-items: end;
      gap: 6px;
    }

    .curve-control label,
    .subdivision-heading {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 24px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
    }

    .terminal-label-mobile {
      display: none;
    }

    .subdivision-heading {
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      transition: opacity .15s, color .15s;
    }

    .subdivision-heading:hover {
      color: var(--ink);
    }

    .subdivision-heading[aria-pressed="false"] {
      opacity: .52;
      text-decoration: line-through;
    }

    .subdivision-heading[aria-pressed="true"] {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .subdivision-control:has(.subdivision-heading[aria-pressed="false"]) #subdivisions,
    .subdivision-control:has(.subdivision-heading[aria-pressed="false"]) #subdivisions-value {
      opacity: .38;
    }

    .curvature-line {
      position: relative;
      display: flex;
      width: 100%;
      height: 39px;
      align-items: flex-start;
      justify-content: center;
    }

    .curvature-line input[type="range"] {
      width: 100%;
      height: 18px;
      margin: 0;
      accent-color: #6b6b6b;
      cursor: pointer;
    }

    .curvature-value {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      pointer-events: none;
    }

    .range-switch {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 3px;
      padding: 4px 10px 4px 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
    }

    .range-switch button {
      padding: 6px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .range-switch button:hover {
      color: var(--ink);
    }

    .range-switch button[aria-pressed="true"] {
      background: var(--neutral-soft);
      color: var(--ink);
    }

    .range-unit {
      padding-left: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .layout {
      display: grid;
      min-height: 0;
      flex: 1;
      grid-template-columns: minmax(340px, 390px) minmax(0, 1fr);
      align-items: stretch;
      gap: 21px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .products {
      display: flex;
      min-height: 0;
      flex-direction: column;
      padding: 15px;
    }

    .section-heading {
      display: none;
    }

    .product-toolbar {
      display: grid;
      flex: 0 0 auto;
      width: 100%;
      grid-template-columns: 33px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      padding-right: 6px;
    }

    .product-toolbar .reset-storage,
    .product-toolbar .preset-select,
    .product-toolbar .add-product {
      height: 33px;
      border: 1px solid var(--line);
      border-radius: var(--radius-ctrl);
      background: var(--paper);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      transition: border-color .15s, color .15s, background .15s;
    }

    .reset-storage {
      display: grid;
      width: 33px;
      place-items: center;
      padding: 0;
      color: var(--muted);
      cursor: pointer;
    }

    .reset-storage svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .preset-select {
      width: 100%;
      min-width: 0;
      padding: 0 10px;
      cursor: pointer;
    }

    .add-product {
      padding: 0 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .product-toolbar .reset-storage:hover,
    .product-toolbar .preset-select:hover,
    .product-toolbar .add-product:hover {
      border-color: var(--muted);
      color: var(--ink);
      background: var(--canvas);
    }

    .product-list {
      display: grid;
      min-height: 0;
      flex: 1;
      align-content: start;
      gap: 9px;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-color: #b5b5b5 transparent;
      scrollbar-width: thin;
    }

    .product-card {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 118px;
      align-items: stretch;
      gap: 9px;
      padding: 9px;
      border: 1.5px solid color-mix(in srgb, var(--product-color), var(--line) 38%);
      border-radius: var(--radius-card);
      background: color-mix(in srgb, var(--product-color), var(--paper) 86%);
      transition: border-color .18s, background .18s, opacity .18s;
    }

    .product-card[draggable="true"] {
      cursor: grab;
    }

    .product-card.is-dragging {
      cursor: grabbing;
      opacity: .35;
    }

    .product-card.is-drop-target {
      outline: 2px dashed var(--product-color);
      outline-offset: 2px;
    }

    .product-card.is-hidden {
      opacity: .5;
    }

    .product-card.is-active,
    .product-card.is-hovered {
      border-color: var(--product-color);
      background: color-mix(in srgb, var(--product-color), var(--paper) 78%);
    }

    @media (prefers-color-scheme: dark) {
      .product-card {
        background: color-mix(in srgb, var(--product-color), var(--paper) 88%);
      }

      .product-card.is-active,
      .product-card.is-hovered {
        background: color-mix(in srgb, var(--product-color), var(--paper) 80%);
      }
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .item-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      line-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }

    .item-action:hover {
      border-color: var(--muted);
      color: var(--ink);
    }

    .item-action[data-action="delete"]:hover {
      border-color: #d45d5d;
      color: #c54848;
    }

    .item-action svg {
      display: block;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .product-top {
      display: flex;
      min-width: 0;
      align-self: stretch;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .product-title {
      display: grid;
      width: 100%;
      height: 100%;
      min-width: 0;
      grid-template-rows: repeat(3, 30px);
      gap: 4px;
      align-items: center;
      justify-items: center;
    }

    .product-name {
      display: block;
      align-self: end;
      max-width: 100%;
      overflow: hidden;
      padding-bottom: 1px;
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.015em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-unit {
      display: block;
      align-self: start;
      max-width: 100%;
      overflow: hidden;
      padding-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-title.is-editing .product-name,
    .product-title.is-editing .product-unit {
      min-height: 1.35em;
      padding: 2px 6px;
      border-radius: 6px;
      outline: 1px solid color-mix(in srgb, var(--product-color), transparent 35%);
      background: var(--paper);
      cursor: text;
    }

    .product-title.is-editing .product-name:focus,
    .product-title.is-editing .product-unit:focus {
      outline: 2px solid var(--product-color);
    }

    .freeze-params {
      display: flex;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--product-color);
      opacity: .42;
      cursor: pointer;
      transition: opacity .15s, background .15s;
    }

    .freeze-params:hover,
    .freeze-params[aria-pressed="true"] {
      opacity: 1;
      background: color-mix(in srgb, var(--product-color), transparent 88%);
    }

    .freeze-params svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .field {
      min-width: 0;
    }

    .input-wrap {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 28px;
      align-items: center;
      min-width: 0;
      height: 30px;
      padding: 0 7px;
      column-gap: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      transition: border-color .15s, box-shadow .15s;
    }

    .input-wrap:focus-within {
      border-color: var(--product-color);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--product-color), transparent 84%);
    }

    .prefix,
    .suffix {
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 500;
      white-space: nowrap;
    }

    .prefix {
      text-align: left;
    }

    .suffix {
      text-align: right;
    }

    .input-wrap input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .input-wrap input::-webkit-inner-spin-button,
    .input-wrap input::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
    }

    .input-wrap input[type=number] {
      appearance: textfield;
    }

    .empty-list {
      padding: 21px 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .chart-panel {
      display: flex;
      min-height: 0;
      flex-direction: column;
      padding: 24px 27px 18px;
    }

    .chart-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .chart-heading h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .chart-wrap {
      position: relative;
      min-height: 220px;
      flex: 1;
      margin-top: 15px;
    }

    #chart {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .tooltip {
      position: absolute;
      z-index: 2;
      display: none;
      min-width: 190px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 10px 28px rgb(0 0 0 / 14%);
      pointer-events: none;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 6px;
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .tooltip-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .tooltip-row b {
      margin-left: auto;
      padding-left: 8px;
      font-weight: 650;
    }

    .tooltip-row i {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
    }

    .tooltip-row.is-highlighted {
      color: var(--ink);
      font-weight: 650;
    }

    .tooltip-row.is-dimmed {
      opacity: .38;
    }

    .chart-legend {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 18px;
      margin: 12px 0 0;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      padding: 4px 2px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .legend-item[aria-pressed="false"] {
      opacity: .38;
      text-decoration: line-through;
    }

    .legend-name {
      font-weight: 600;
    }

    @media (max-width: 1080px) {
      .topbar {
        flex-wrap: wrap;
        gap: 15px 18px;
      }

      .header-controls {
        flex: 1 1 100%;
        justify-content: space-between;
        gap: 18px;
      }

      .curve-controls {
        flex: 1 1 auto;
        gap: 12px;
      }
    }

    @media (max-width: 860px) {
      .app {
        height: auto;
        min-height: 100vh;
        padding: 18px;
        gap: 15px;
      }

      .layout {
        flex: 0 0 auto;
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .products {
        max-height: 420px;
      }

      .chart-panel {
        min-height: 460px;
        padding: 21px 18px 18px;
      }

      .chart-wrap {
        min-height: 320px;
      }
    }

    @media (max-width: 600px) {
      .app {
        padding: 15px 12px 21px;
        gap: 12px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
      }

      .brand {
        min-width: 0;
      }

      .brand-name {
        font-size: 19px;
      }

      .brand-caption {
        font-size: 12px;
      }

      .header-controls {
        display: contents;
      }

      .range-switch {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
        padding: 3px 8px 3px 3px;
      }

      .range-switch button {
        padding: 6px 8px;
        font-size: 12.5px;
      }

      .range-unit {
        font-size: 11px;
      }

      .curve-controls {
        grid-column: 1 / -1;
        grid-row: 2;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 18px;
        padding: 12px 15px 9px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
      }

      .curve-control {
        grid-template-rows: 20px 36px;
        gap: 4px;
      }

      .curve-control label,
      .subdivision-heading {
        min-height: 20px;
        font-size: 11.5px;
      }

      .terminal-label-desktop {
        display: none;
      }

      .terminal-label-mobile {
        display: inline;
      }

      .curvature-line {
        height: 36px;
      }

      .curvature-value {
        top: 20px;
        font-size: 11.5px;
      }

      .products {
        max-height: 360px;
        padding: 12px;
      }

      .product-toolbar {
        grid-template-columns: 32px minmax(0, 1fr) auto;
        gap: 6px;
        margin-bottom: 9px;
        padding-right: 4px;
      }

      .product-toolbar .reset-storage,
      .product-toolbar .preset-select,
      .product-toolbar .add-product {
        height: 32px;
        font-size: 11.5px;
      }

      .product-card {
        grid-template-columns: 28px minmax(0, 1fr) 110px;
        gap: 7px;
        padding: 8px;
      }

      .item-action {
        width: 28px;
        height: 28px;
      }

      .item-action svg {
        width: 16px;
        height: 16px;
      }

      .product-title {
        grid-template-rows: repeat(3, 28px);
      }

      .freeze-params {
        width: 28px;
        height: 28px;
      }

      .product-name {
        font-size: 13.5px;
      }

      .product-unit {
        font-size: 11.5px;
      }

      .input-wrap {
        grid-template-columns: 20px minmax(0, 1fr) 26px;
        height: 28px;
        padding: 0 6px;
      }

      .prefix,
      .suffix {
        font-size: 10px;
      }

      .input-wrap input {
        font-size: 12px;
      }

      .chart-panel {
        min-height: 390px;
        padding: 18px 12px 15px;
      }

      .chart-heading h2 {
        font-size: 20px;
      }

      .chart-wrap {
        min-height: 260px;
        margin-top: 12px;
      }

      .chart-legend {
        flex-wrap: nowrap;
        justify-content: flex-start;
        gap: 14px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0 12px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        mask-image: linear-gradient(to right, transparent, #000 12px, #000 calc(100% - 12px), transparent);
      }

      .chart-legend::-webkit-scrollbar {
        display: none;
      }

      .legend-item {
        flex: 0 0 auto;
        white-space: nowrap;
        font-size: 11.5px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div>
          <p class="brand-name">Produto Fresco</p>
          <p class="brand-caption">o valor certo, no tempo certo</p>
        </div>
      </div>
      <div class="header-controls">
        <div class="curve-controls">
          <div class="curve-control">
            <label for="freshness-days">Período de frescor</label>
            <div class="curvature-line"><input id="freshness-days" type="range" min="20" max="50" step="1" value="20" aria-label="Percentual da validade em que o preço permanece no máximo após a produção"><span class="curvature-value" id="freshness-days-value">20%</span></div>
          </div>
          <div class="curve-control">
            <label for="terminal-days"><span class="terminal-label-desktop">Prazo final de venda</span><span class="terminal-label-mobile">Prazo final</span></label>
            <div class="curvature-line"><input id="terminal-days" type="range" min="20" max="33" step="1" value="25" aria-label="Percentual final da validade em que o preço permanece no mínimo"><span class="curvature-value" id="terminal-days-value">25%</span></div>
          </div>
          <div class="curve-control curvature-control">
            <label for="curvature">Fator de curvatura</label>
            <div class="curvature-line"><input id="curvature" type="range" min="1" max="2.5" step="0.1" value="1.5"
                aria-label="Fator de curvatura da queda de preço"><span class="curvature-value"
                id="curvature-value">1,5</span></div>
          </div>
          <div class="curve-control curvature-control subdivision-control">
            <button class="subdivision-heading" id="subdivisions-enabled" type="button" aria-pressed="false">&lt; Subdivisões &gt;</button>
            <div class="curvature-line"><input id="subdivisions" type="range" min="2" max="5" step="1" value="3"
                aria-label="Número de patamares de preço entre o prazo de frescor e o prazo terminal de venda"><span class="curvature-value"
                id="subdivisions-value">3</span></div>
          </div>
        </div>
        <div class="range-switch" role="group" aria-label="Período do gráfico">
          <button type="button" data-range="30" aria-pressed="true">30</button>
          <button type="button" data-range="60" aria-pressed="false">60</button>
          <button type="button" data-range="90" aria-pressed="false">90</button>
          <span class="range-unit">dias</span>
        </div>
      </div>
    </header>
    <div class="layout">
      <aside class="panel products" aria-labelledby="products-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Sua lista</p>
            <h1 id="products-title">Alimentos frescos</h1>
          </div>
          <span class="count">6 itens</span>
        </div>
        <div class="product-toolbar"><button id="reset-storage" type="button" class="reset-storage" aria-label="Limpar dados salvos" title="Limpar dados salvos"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10a7 7 0 1 0 2.05-4.95L3 7"/><path d="M3 3v4h4"/></svg></button><select id="preset-select" class="preset-select" aria-label="Preset"><option value="geral">Geral</option><option value="ovos">Ovos</option><option value="laticinios">Laticínios</option><option value="carne">Carnes</option></select><button id="add-product" type="button" class="add-product">Adicionar Item</button></div>
        <div id="product-list" class="product-list"></div>
      </aside>
      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="chart-heading">
          <div>
            <h2 id="chart-title">Curva de Preços</h2>
          </div>
        </div>
        <div class="chart-wrap" id="chart-wrap">
          <svg id="chart" role="img" aria-label="Gráfico de curvas de preço dos alimentos frescos"></svg>
          <div class="tooltip" id="tooltip"></div>
        </div>
        <div class="chart-legend" id="chart-legend" aria-label="Produtos no gráfico"></div>
      </section>
    </div>
  </main>
  <script>
    const defaults = [
      { name: 'Ovos brancos', unit: 'bandeja · 30 unidades', max: 19.90, min: 12.90, shelf: 30, color: '#d45d5d' },
      { name: 'Ovos vermelhos', unit: 'bandeja · 30 unidades', max: 24.90, min: 14.90, shelf: 30, color: '#e3913e' },
      { name: 'Ovos caipiras', unit: 'bandeja · 20 unidades', max: 29.90, min: 16.90, shelf: 30, color: '#d5b441' },
      { name: 'Leite fresco', unit: 'garrafa · 1 litro', max: 9.90, min: 4.90, shelf: 30, color: '#55a86b' },
      { name: 'Creme de leite fresco', unit: 'garrafa · 500 ml', max: 29.00, min: 15.90, shelf: 30, color: '#3c9da6' },
      { name: 'Carne bovina resfriada', unit: 'bandeja · 1 kg', max: 39.90, min: 29.90, shelf: 30, color: '#527ec0' },
      { name: 'Carne suína resfriada', unit: 'bandeja · 1 kg', max: 24.90, min: 18.90, shelf: 30, color: '#8d65b4' }
    ];
    const storageKey = 'produto-fresco-itens-v1';
    const presetKey = 'produto-fresco-preset-v1';
    const curveSettingsKey = 'produto-fresco-curva-v1';
    let savedCurveSettings = {};
    try { savedCurveSettings = JSON.parse(localStorage.getItem(curveSettingsKey) || '{}') || {}; } catch (_) {}
    const palette = defaults.map(item => item.color);
    const presetProducts = {
      geral: defaults,
      ovos: defaults.slice(0, 3),
      laticinios: [
        defaults[3], defaults[4],
        { name: 'Manteiga', unit: 'pote · 500 ml', max: 24.90, min: 15.90, shelf: 60, color: '#d5b441' },
        { name: 'Requeijão cremoso', unit: 'pote · 200 g', max: 12.90, min: 7.90, shelf: 45, color: '#c45f91' },
        { name: 'Iogurte natural integral', unit: 'pote · 500 g', max: 14.90, min: 8.90, shelf: 30, color: '#8d65b4' }
      ],
      carne: [
        { name: 'Acém resfriado', unit: 'bandeja · 1 kg', max: 34.90, min: 25.90, shelf: 30, color: '#3c9da6' },
        { name: 'Alcatra resfriada', unit: 'bandeja · 1 kg', max: 54.90, min: 42.90, shelf: 30, color: '#e3913e' },
        { name: 'Contrafilé resfriado', unit: 'bandeja · 1 kg', max: 59.90, min: 46.90, shelf: 30, color: '#d5b441' },
        { name: 'Patinho resfriado', unit: 'bandeja · 1 kg', max: 49.90, min: 37.90, shelf: 30, color: '#55a86b' },
        { name: 'Coxão mole resfriado', unit: 'bandeja · 1 kg', max: 46.90, min: 35.90, shelf: 30, color: '#765bb8' }
      ]
    };
    const namedColors = Object.fromEntries(Object.values(presetProducts).flat().map(product => [product.name, product.color]));
    function presetStorageKey(preset) { return preset === 'geral' ? storageKey : storageKey + '-' + preset; }
    function loadProducts(key, base) {
      try {
        const saved = JSON.parse(localStorage.getItem(key));
        if (Array.isArray(saved) && saved.every(item => item && typeof item.name === 'string' && typeof item.unit === 'string' && Number.isFinite(Number(item.max)) && Number.isFinite(Number(item.min)) && Number.isFinite(Number(item.shelf)))) {
          const loaded = saved.map((item, index) => ({
            name: item.name, unit: item.unit,
            max: Number(item.max), min: Number(item.min), shelf: Math.max(1, Number(item.shelf)),
            color: namedColors[item.name] || (/^#[0-9a-f]{6}$/i.test(item.color || '') ? item.color : palette[index % palette.length]),
            curveParams: item.curveParams && typeof item.curveParams === 'object' ? item.curveParams : null,
            visible: item.visible !== false
          }));
          if (key === storageKey + '-carne') {
            const renamed = new Map([
              ['Acém bovino resfriado', 'Acém resfriado'],
              ['Alcatra bovina resfriada', 'Alcatra resfriada'],
              ['Contrafilé bovino resfriado', 'Contrafilé resfriado'],
              ['Patinho bovino resfriado', 'Patinho resfriado'],
              ['Coxão mole bovino resfriado', 'Coxão mole resfriado']
            ]);
            let migrated = false;
            loaded.forEach(product => {
              if (renamed.has(product.name)) {
                product.name = renamed.get(product.name);
                product.shelf = 30;
                migrated = true;
              }
              if (namedColors[product.name]) product.color = namedColors[product.name];
            });
            if (migrated) localStorage.setItem(key, JSON.stringify(loaded));
          }
          return loaded;
        }
      } catch (_) {}
      return base.map((item, index) => ({ ...item, color: namedColors[item.name] || item.color || palette[index % palette.length], visible: true }));
    }
    let activePreset = localStorage.getItem(presetKey) || 'geral';
    if (!presetProducts[activePreset]) activePreset = 'geral';
    const products = loadProducts(presetStorageKey(activePreset), presetProducts[activePreset]);
    const visible = products.map(item => item.visible !== false);
    const list = document.querySelector('#product-list');
    const legend = document.querySelector('#chart-legend');
    const chart = document.querySelector('#chart');
    const wrap = document.querySelector('#chart-wrap');
    const tooltip = document.querySelector('#tooltip');
    let maxDays = 30;
    let rangeProductSignature = null;
    let freshnessPct = Number.isInteger(savedCurveSettings.freshnessPct) && savedCurveSettings.freshnessPct >= 20 && savedCurveSettings.freshnessPct <= 50 ? savedCurveSettings.freshnessPct : 20;
    let terminalPct = Number.isInteger(savedCurveSettings.terminalPct) && savedCurveSettings.terminalPct >= 20 && savedCurveSettings.terminalPct <= 33 ? savedCurveSettings.terminalPct : 25;
    let curvature = Number.isFinite(savedCurveSettings.curvature) && savedCurveSettings.curvature >= 1 && savedCurveSettings.curvature <= 2.5 ? savedCurveSettings.curvature : 1.5;
    let subdivisions = Number.isInteger(savedCurveSettings.subdivisions) && savedCurveSettings.subdivisions >= 2 && savedCurveSettings.subdivisions <= 5 ? savedCurveSettings.subdivisions : 3;
    let subdivisionsEnabled = savedCurveSettings.subdivisionsEnabled === true;
    let selected = null;
    let hovered = null;
    let draggedIndex = null;
    const undoHistory = [];
    let pendingFieldSnapshot = null;
    const money = value => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);

    function saveProducts() {
      try {
        localStorage.setItem(presetStorageKey(activePreset), JSON.stringify(products.map((product, index) => ({ ...product, visible: visible[index] !== false }))));
        localStorage.setItem(presetKey, activePreset);
      } catch (_) {}
    }

    function rememberProducts() {
      undoHistory.push({ preset: activePreset, products: JSON.parse(JSON.stringify(products)), visible: [...visible] });
      if (undoHistory.length > 50) undoHistory.shift();
    }

    function undoProductChange() {
      const previous = undoHistory.pop();
      if (!previous) return;
      activePreset = previous.preset;
      presetSelect.value = activePreset;
      products.splice(0, products.length, ...previous.products);
      visible.splice(0, visible.length, ...previous.visible);
      selected = hovered = null;
      saveProducts();
      renderProducts();
      renderLegend();
      drawChart();
    }

    document.addEventListener('keydown', event => {
      if (!(event.ctrlKey || event.metaKey) || event.key.toLowerCase() !== 'z') return;
      if (event.target.matches('input, textarea, [contenteditable="true"]')) return;
      event.preventDefault();
      undoProductChange();
    });

    function saveCurveSettings() {
      try {
        localStorage.setItem(curveSettingsKey, JSON.stringify({ freshnessPct, terminalPct, curvature, subdivisions, subdivisionsEnabled }));
      } catch (_) {}
    }

    const presetSelect = document.querySelector('#preset-select');
    presetSelect.value = activePreset;
    presetSelect.addEventListener('change', () => {
      activePreset = presetSelect.value;
      const nextProducts = loadProducts(presetStorageKey(activePreset), presetProducts[activePreset]);
      products.splice(0, products.length, ...nextProducts);
      visible.splice(0, visible.length, ...nextProducts.map(product => product.visible !== false));
      selected = null;
      hovered = null;
      saveProducts();
      renderProducts();
      renderLegend();
      drawChart();
    });
    document.querySelector('#reset-storage').addEventListener('click', () => {
      if (!window.confirm('Limpar os dados salvos neste navegador e restaurar as listas padrão?')) return;
      localStorage.clear();
      window.location.reload();
    });

    function updateProductPanel() {
      list.querySelectorAll('.product-card').forEach((card, index) => {
        card.classList.toggle('is-active', index === selected);
        card.classList.toggle('is-hovered', hovered !== null && index === hovered);
        card.classList.toggle('is-hidden', !visible[index]);
        const button = card.querySelector('[data-action="visibility"]');
        if (button) {
          button.setAttribute('aria-pressed', String(visible[index]));
          button.setAttribute('aria-label', visible[index] ? 'Ocultar produto no gráfico' : 'Mostrar produto no gráfico');
          button.title = visible[index] ? 'Ocultar no gráfico' : 'Mostrar no gráfico';
        }
      });
    }

    function renderProducts() {
      document.querySelector('.count').textContent = products.length + ' itens';
      if (!products.length) {
        list.innerHTML = '<p class="empty-list">Nenhum item na lista. Adicione um produto.</p>';
        return;
      }
      list.innerHTML = products.map(() => `
        <article class="product-card" draggable="true">
          <div class="item-actions">
            <button class="item-action" type="button" data-action="rename" title="Renomear"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.7 4.3 15.7 7.3M3.6 16.4l3.5-.8 8.6-8.6a2.1 2.1 0 0 0-3-3l-8.6 8.6-.5 3.8Z"/></svg></button>
            <button class="item-action" type="button" data-action="visibility"><svg viewBox="0 0 20 20" aria-hidden="true"></svg></button>
            <button class="item-action" type="button" data-action="delete" title="Excluir"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M7 5.5V3.5h6v2m2.2 0-.8 11H5.6l-.8-11M8.2 8.5v5.2m3.6-5.2v5.2"/></svg></button>
          </div>
          <div class="product-top"><span class="product-title"><span class="product-name"></span><span class="product-unit"></span><button class="freeze-params" type="button" data-action="freeze-params" aria-pressed="false" aria-label="Congelar parâmetros deste item" title="Congelar parâmetros deste item"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v16M3.1 6l13.8 8M3.1 14l13.8-8M7.5 3.5 10 5l2.5-1.5M7.5 16.5 10 15l2.5 1.5M2.8 8.5 5.5 8 6 5.5M14 14.5l.5-2.5 2.7-.5M2.8 11.5l2.7.5.5 2.5M14 5.5l.5 2.5 2.7.5"/></svg></button></span></div>
          <div class="fields">
            <div class="field"><div class="input-wrap"><span class="prefix">R$</span><input data-key="max" type="number" min="0" step="0.50"><span class="suffix">máx</span></div></div>
            <div class="field"><div class="input-wrap"><span class="prefix">R$</span><input data-key="min" type="number" min="0" step="0.50"><span class="suffix">mín</span></div></div>
            <div class="field"><div class="input-wrap"><span class="prefix">exp.</span><input data-key="shelf" type="number" min="1" max="365" step="1"><span class="suffix">dias</span></div></div>
          </div>
        </article>`).join('');

      list.querySelectorAll('.product-card').forEach((card, index) => {
        const product = products[index];
        card.dataset.card = index;
        card.style.setProperty('--product-color', product.color);
        card.querySelector('.product-name').textContent = product.name;
        card.querySelector('.product-unit').textContent = product.unit;
        const freezeButton = card.querySelector('[data-action="freeze-params"]');
        freezeButton.setAttribute('aria-pressed', String(Boolean(product.curveParams)));
        freezeButton.setAttribute('aria-label', product.curveParams ? 'Descongelar parâmetros deste item' : 'Congelar parâmetros deste item');
        freezeButton.title = product.curveParams ? 'Parâmetros congelados neste item' : 'Congelar parâmetros deste item';
        freezeButton.addEventListener('click', event => {
          event.stopPropagation();
          product.curveParams = product.curveParams ? null : { freshnessPct, terminalPct, curvature, subdivisions, subdivisionsEnabled };
          saveProducts();
          renderProducts();
          drawChart();
        });
        card.querySelector('[data-action="rename"]').setAttribute('aria-label', 'Renomear ' + product.name);
        card.querySelector('[data-action="delete"]').setAttribute('aria-label', 'Excluir ' + product.name);
        card.querySelectorAll('input').forEach(input => {
          const key = input.dataset.key;
          input.id = key + '-' + index;
          input.dataset.index = index;
          input.value = key === 'shelf' ? String(product[key]) : Number(product[key]).toFixed(2);
          input.addEventListener('focus', () => {
            if (!pendingFieldSnapshot) pendingFieldSnapshot = { preset: activePreset, products: JSON.parse(JSON.stringify(products)), visible: [...visible] };
          });
          input.setAttribute('aria-label', (key === 'max' ? 'Preço máximo de ' : key === 'min' ? 'Preço mínimo de ' : 'Tempo de prateleira de ') + product.name);
          input.addEventListener('input', event => {
            const value = Number(event.currentTarget.value);
            if (!Number.isFinite(value) || value < 0) return;
            product[key] = key === 'shelf' ? Math.max(1, value) : value;
            saveProducts();
            drawChart();
          });
          input.addEventListener('blur', () => {
            if (!pendingFieldSnapshot) return;
            undoHistory.push(pendingFieldSnapshot);
            pendingFieldSnapshot = null;
            if (undoHistory.length > 50) undoHistory.shift();
          });
        });
        const visibilityButton = card.querySelector('[data-action="visibility"]');
        visibilityButton.setAttribute('aria-pressed', String(visible[index]));
        visibilityButton.setAttribute('aria-label', visible[index] ? 'Ocultar produto no gráfico' : 'Mostrar produto no gráfico');
        visibilityButton.title = visible[index] ? 'Ocultar no gráfico' : 'Mostrar no gráfico';
        visibilityButton.querySelector('svg').innerHTML = visible[index]
          ? '<path d="M2 10s3-5.2 8-5.2S18 10 18 10s-3 5.2-8 5.2S2 10 2 10Z"/><circle cx="10" cy="10" r="2.3"/>'
          : '<path d="M3 3 17 17M8.6 5a8.4 8.4 0 0 1 1.4-.2c5 0 8 5.2 8 5.2a12.5 12.5 0 0 1-2.3 2.8M5.3 5.7C3.1 7 2 10 2 10s3 5.2 8 5.2c.8 0 1.5-.1 2.2-.4"/><path d="M8.5 8.5a2.2 2.2 0 0 0 3 3"/>';

        card.addEventListener('click', () => {
          selected = Number(card.dataset.card);
          drawChart();
        });
        const renameButton = card.querySelector('[data-action="rename"]');
        const title = card.querySelector('.product-title');
        const nameField = card.querySelector('.product-name');
        const unitField = card.querySelector('.product-unit');
        let editOriginal = null;
        function setRenameIcon(editing) {
          renameButton.setAttribute('aria-label', editing ? 'Concluir edição de ' + product.name : 'Editar nome e unidade de ' + product.name);
          renameButton.title = editing ? 'Concluir edição' : 'Editar nome e unidade';
          renameButton.querySelector('svg').innerHTML = editing
            ? '<path d="m4 10 4 4 8-8"/>'
            : '<path d="M12.8 4.2 15.8 7.2M3.5 16.5l3.7-.8 8.4-8.4a2.1 2.1 0 0 0-3-3l-8.4 8.4-.7 3.8Z"/>';
        }
        function finishInlineEdit(cancel = false) {
          if (!card.classList.contains('is-editing')) return;
          if (cancel) {
            nameField.textContent = editOriginal.name;
            unitField.textContent = editOriginal.unit;
          }
          const changed = nameField.textContent.trim() !== editOriginal.name || unitField.textContent.trim() !== editOriginal.unit;
          if (changed && !cancel) rememberProducts();
          product.name = nameField.textContent.trim() || editOriginal.name;
          product.unit = unitField.textContent.trim() || editOriginal.unit;
          nameField.textContent = product.name;
          unitField.textContent = product.unit;
          nameField.removeAttribute('contenteditable');
          unitField.removeAttribute('contenteditable');
          nameField.removeAttribute('role');
          unitField.removeAttribute('role');
          title.classList.remove('is-editing');
          card.classList.remove('is-editing');
          setRenameIcon(false);
          card.querySelector('[data-action="delete"]').setAttribute('aria-label', 'Excluir ' + product.name);
          saveProducts();
          renderLegend();
          drawChart();
        }
        renameButton.addEventListener('click', event => {
          event.stopPropagation();
          if (card.classList.contains('is-editing')) { finishInlineEdit(); return; }
          editOriginal = { name: product.name, unit: product.unit };
          title.classList.add('is-editing');
          card.classList.add('is-editing');
          [nameField, unitField].forEach((field, fieldIndex) => {
            field.contentEditable = 'true';
            field.setAttribute('role', 'textbox');
            field.setAttribute('aria-label', fieldIndex === 0 ? 'Nome do item' : 'Unidade do item');
            field.spellcheck = false;
            field.addEventListener('click', event => event.stopPropagation());
            field.addEventListener('keydown', event => {
              if (event.key === 'Enter') { event.preventDefault(); finishInlineEdit(); }
              if (event.key === 'Escape') { event.preventDefault(); finishInlineEdit(true); }
            });
          });
          setRenameIcon(true);
          nameField.focus();
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(nameField);
          range.collapse(false);
          selection.removeAllRanges();
          selection.addRange(range);
        });
        card.addEventListener('focusout', () => {
          window.setTimeout(() => {
            if (card.classList.contains('is-editing') && !card.contains(document.activeElement)) finishInlineEdit();
          }, 0);
        });
        visibilityButton.addEventListener('click', event => {
          event.stopPropagation();
          visible[index] = !visible[index];
          if (!visible[index] && hovered === index) hovered = null;
          if (!visible[index] && selected === index) selected = null;
          saveProducts();
          renderProducts();
          renderLegend();
          drawChart();
        });
        card.querySelector('[data-action="delete"]').addEventListener('click', event => {
          event.stopPropagation();
          rememberProducts();
          products.splice(index, 1);
          visible.splice(index, 1);
          selected = null;
          hovered = null;
          saveProducts();
          renderProducts();
          renderLegend();
          drawChart();
        });

        card.addEventListener('dragstart', event => {
          if (event.target.closest('button, input, select, textarea, [contenteditable="true"]')) {
            event.preventDefault();
            return;
          }
          draggedIndex = index;
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', String(index));
          card.classList.add('is-dragging');
        });
        card.addEventListener('pointerdown', event => {
          if (event.target.closest('button, input, select, textarea, [contenteditable="true"]')) {
            card.draggable = false;
          }
        });
        card.addEventListener('pointerup', () => { card.draggable = true; });
        card.addEventListener('pointercancel', () => { card.draggable = true; });
        card.addEventListener('dragend', () => {
          draggedIndex = null;
          list.querySelectorAll('.product-card').forEach(item => item.classList.remove('is-dragging', 'is-drop-target'));
        });
        card.addEventListener('dragover', event => {
          event.preventDefault();
          if (Number(card.dataset.card) !== draggedIndex) card.classList.add('is-drop-target');
        });
        card.addEventListener('dragleave', () => card.classList.remove('is-drop-target'));
        card.addEventListener('drop', event => {
          event.preventDefault();
          card.classList.remove('is-drop-target');
          const from = Number(event.dataTransfer.getData('text/plain'));
          const to = Number(card.dataset.card);
          if (!Number.isInteger(from) || !Number.isInteger(to) || from === to) return;
          rememberProducts();
          const [movedProduct] = products.splice(from, 1);
          const [movedVisible] = visible.splice(from, 1);
          products.splice(to, 0, movedProduct);
          visible.splice(to, 0, movedVisible);
          selected = null;
          hovered = null;
          saveProducts();
          renderProducts();
          renderLegend();
          drawChart();
        });
      });
      updateProductPanel();
    }

    function renderLegend() {
      legend.innerHTML = products.map(() => '<button class="legend-item" type="button"><span class="legend-name"></span></button>').join('');
      legend.querySelectorAll('button').forEach((button, index) => {
        const product = products[index];
        button.dataset.index = index;
        button.setAttribute('aria-pressed', String(visible[index]));
        const name = button.querySelector('.legend-name');
        name.textContent = product.name;
        name.style.color = product.color;
        button.addEventListener('click', () => {
          visible[index] = !visible[index];
          if (!visible[index] && hovered === index) hovered = null;
          if (!visible[index] && selected === index) selected = null;
          saveProducts();
          renderProducts();
          renderLegend();
          drawChart();
        });
      });
    }

    document.querySelector('#add-product').addEventListener('click', event => {
      event.stopPropagation();
      const name = window.prompt('Nome do novo item:');
      if (name === null || !name.trim()) return;
      rememberProducts();
      products.push({ name: name.trim(), unit: 'unidade', max: 0, min: 0, shelf: 7, color: palette[products.length % palette.length] });
      visible.push(true);
      selected = null;
      hovered = null;
      saveProducts();
      renderProducts();
      renderLegend();
      drawChart();
      list.lastElementChild?.scrollIntoView({ block: 'nearest' });
    });

    document.addEventListener('click', event => {
      if (event.target.closest('.product-card, [data-product], #add-product')) return;
      if (selected !== null || hovered !== null) {
        selected = null;
        hovered = null;
        list.querySelectorAll('.product-card').forEach(card => card.classList.remove('is-active'));
        drawChart();
      }
    });
    function resolveCurveDays(product, params) {
      const fPct = Number.isFinite(params.freshnessPct)
        ? params.freshnessPct
        : Number.isFinite(params.freshnessDays)
          ? (params.freshnessDays / Math.max(1, product.shelf)) * 100
          : freshnessPct;
      const tPct = Number.isFinite(params.terminalPct)
        ? params.terminalPct
        : Number.isFinite(params.terminalDays)
          ? (params.terminalDays / Math.max(1, product.shelf)) * 100
          : terminalPct;
      const freshnessDay = product.shelf * (fPct / 100);
      const targetDay = Math.max(0, product.shelf * (1 - tPct / 100));
      return { freshnessDay, targetDay };
    }

    function commercialRound(value, minPrice, maxPrice) {
      const low = Math.min(minPrice, maxPrice);
      const high = Math.max(minPrice, maxPrice);
      const spread = high - low;
      if (spread <= 0.01) return Math.round(low * 100) / 100;

      const minTenths = Math.floor(low * 10 + 1e-6) + 1;
      const maxTenths = Math.ceil(high * 10 - 1e-6) - 1;
      const targetTenths = Math.round(value * 10);

      if (minTenths <= maxTenths) {
        const clampedTenths = Math.min(maxTenths, Math.max(minTenths, targetTenths));
        return Math.round(clampedTenths * 10) / 100;
      }

      const rounded = targetTenths / 10;
      return Math.round(Math.min(high, Math.max(low, rounded)) * 100) / 100;
    }

    function logarithmicBoundaries(curveStart, targetDay, count) {
      const startDay = Math.round(curveStart);
      const endDay = Math.round(targetDay);
      const totalDays = endDay - startDay;
      if (totalDays <= 0) return [];
      const steps = Math.min(count, totalDays);
      // Progressão logarítmica/geométrica independente da curvatura:
      // cada degrau reduz proporcionalmente (~68% do anterior) do fim do frescor até o prazo final
      const decayRatio = 0.68;
      const weights = Array.from({ length: steps }, (_, index) => Math.pow(decayRatio, index));
      const weightSum = weights.reduce((sum, w) => sum + w, 0);
      const rawWidths = weights.map(w => (w / weightSum) * totalDays);
      const widths = rawWidths.map(w => Math.max(1, Math.floor(w)));
      let diff = totalDays - widths.reduce((sum, w) => sum + w, 0);
      if (diff > 0) {
        const order = rawWidths
          .map((w, index) => ({ index, rem: w - widths[index] }))
          .sort((a, b) => b.rem - a.rem || a.index - b.index);
        for (let i = 0; i < diff; i++) widths[order[i % order.length].index] += 1;
      } else if (diff < 0) {
        for (let i = steps - 1; i >= 0 && diff < 0; i--) {
          const take = Math.min(widths[i] - 1, -diff);
          widths[i] -= take;
          diff += take;
        }
      }
      widths.sort((a, b) => b - a);
      const boundaries = [startDay];
      for (const width of widths) boundaries.push(boundaries[boundaries.length - 1] + width);
      return boundaries;
    }

    function priceAt(product, day) {
      if (day > product.shelf) return null;
      const params = product.curveParams || { freshnessPct, terminalPct, curvature };
      const { freshnessDay, targetDay } = resolveCurveDays(product, params);
      if (targetDay === 0) return product.min;
      if (targetDay > freshnessDay && day <= freshnessDay) return product.max;
      const curveStart = targetDay > freshnessDay ? freshnessDay : 0;
      const progress = Math.min(1, Math.max(0, (day - curveStart) / Math.max(0.01, targetDay - curveStart)));
      const curvedProgress = Math.pow(progress, params.curvature);
      return product.max - (product.max - product.min) * curvedProgress;
    }

    function priceSegments(product) {
      const params = product.curveParams || { freshnessPct, terminalPct, curvature, subdivisions, subdivisionsEnabled };
      const { freshnessDay, targetDay } = resolveCurveDays(product, params);
      const curveStart = targetDay > freshnessDay ? freshnessDay : 0;
      if (targetDay <= curveStart) return [];
      const boundaries = logarithmicBoundaries(curveStart, targetDay, params.subdivisions);
      if (boundaries.length < 2) return [];
      const count = boundaries.length - 1;
      const segments = [];
      for (let index = 0; index < count; index++) {
        const start = boundaries[index];
        const end = boundaries[index + 1];
        if (end <= start) continue;
        let total = 0;
        for (let day = start; day < end; day++) total += priceAt(product, day + 0.5);
        let price = commercialRound(total / (end - start), product.min, product.max);
        if (segments.length && price > segments[segments.length - 1].price) {
          price = segments[segments.length - 1].price;
        }
        segments.push({ start, end, price });
      }
      return segments;
    }

    function usesSubdivisions(product) {
      return product.curveParams ? product.curveParams.subdivisionsEnabled === true : subdivisionsEnabled;
    }

    function drawChart() {
      const productSignature = products.map(product => `${product.name}:${product.shelf}`).join('|');
      const requiredDays = Math.max(0, ...products.map(product => product.shelf));
      const fittingRange = requiredDays > 60 ? 90 : requiredDays > 30 ? 60 : 30;
      if (productSignature !== rangeProductSignature) {
        rangeProductSignature = productSignature;
        maxDays = fittingRange;
        document.querySelectorAll('[data-range]').forEach(button =>
          button.setAttribute('aria-pressed', String(Number(button.dataset.range) === maxDays)));
      }
      const bounds = wrap.getBoundingClientRect();
      const width = Math.max(280, bounds.width);
      const height = Math.max(300, bounds.height);
      const mobile = width < 500;
      const pad = { top: 15, right: mobile ? 18 : 27, bottom: mobile ? 45 : 48, left: mobile ? 51 : 60 };
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const axisFont = mobile ? 11 : 12;
      const values = products.length ? products.flatMap(product => [product.max, product.min]) : [0, 1];
      const minValue = Math.max(0, Math.floor(Math.min(...values) / 10) * 10);
      const maxValue = Math.ceil(Math.max(...values) / 10) * 10;
      const x = day => pad.left + day / maxDays * innerW;
      const y = value => pad.top + (maxValue - value) / (maxValue - minValue || 1) * innerH;
      const moneyTick = value => `R$ ${Math.round(value)}`;
      let markup = '';

      for (let value = minValue; value <= maxValue; value += 1) {
        if (value % 10 === 0) continue;
        const isFive = value % 5 === 0;
        const yy = y(value);
        markup += `<line x1="${pad.left}" y1="${yy}" x2="${width - pad.right}" y2="${yy}" stroke="var(--chart-grid)" stroke-width="${isFive ? 0.8 : 0.55}" opacity="${isFive ? 0.62 : 0.32}"/>`;
      }

      for (let value = minValue; value <= maxValue; value += 10) {
        const yy = y(value);
        markup += `<line x1="${pad.left}" y1="${yy}" x2="${width - pad.right}" y2="${yy}" stroke="var(--chart-grid)" stroke-width="1"/>`;
        markup += `<text x="${pad.left - 12}" y="${yy + 4}" fill="var(--chart-muted)" font-size="${axisFont}" text-anchor="end">${moneyTick(value)}</text>`;
      }
      const tickStep = maxDays === 30 ? 5 : 10;
      for (let day = 0; day <= maxDays; day += tickStep) {
        const xx = x(day);
        markup += `<line x1="${xx}" y1="${pad.top}" x2="${xx}" y2="${height - pad.bottom}" stroke="var(--chart-grid)" stroke-width="1"/>`;
        markup += `<text x="${xx}" y="${height - pad.bottom + 18}" fill="var(--chart-muted)" font-size="${axisFont}" text-anchor="middle">${day}</text>`;
      }
      markup += `<text x="${pad.left + innerW / 2}" y="${height - 8}" fill="var(--chart-muted)" font-size="${axisFont}" font-weight="500" text-anchor="middle">Dias desde a produção</text>`;

      products.forEach((product, index) => {
        if (!visible[index]) return;
        const focusIndex = hovered === null ? selected : hovered;
        const hasFocus = focusIndex !== null;
        const emphasized = index === focusIndex;
        const endDay = Math.min(maxDays, product.shelf);
        let path = '';
        const segments = usesSubdivisions(product) ? priceSegments(product) : [];
        if (segments.length) {
          path = `M${x(0).toFixed(2)},${y(product.max).toFixed(2)} L${x(segments[0].start).toFixed(2)},${y(product.max).toFixed(2)} `;
          segments.forEach((segment, index) => {
            path += `L${x(segment.start).toFixed(2)},${y(segment.price).toFixed(2)} L${x(segment.end).toFixed(2)},${y(segment.price).toFixed(2)} `;
            if (index < segments.length - 1) path += `L${x(segment.end).toFixed(2)},${y(segments[index + 1].price).toFixed(2)} `;
          });
          const lastEnd = segments[segments.length - 1].end;
          if (lastEnd < endDay) path += `L${x(lastEnd).toFixed(2)},${y(product.min).toFixed(2)} L${x(endDay).toFixed(2)},${y(product.min).toFixed(2)} `;
        } else {
          const samples = Math.max(2, Math.ceil(endDay * 2));
          for (let point = 0; point <= samples; point++) {
            const day = endDay * point / samples;
            path += `${point === 0 ? 'M' : 'L'}${x(day).toFixed(2)},${y(priceAt(product, day)).toFixed(2)} `;
          }
        }
        markup += `<path data-product="${index}" d="${path}" fill="none" stroke="${product.color}" stroke-width="${hasFocus ? (emphasized ? 3.8 : 2.1) : 2.2}" stroke-linecap="round" stroke-linejoin="round" opacity="${hasFocus ? (emphasized ? 1 : .22) : .77}"/>`;
        if (product.shelf <= maxDays) markup += `<circle data-product="${index}" cx="${x(product.shelf)}" cy="${y(priceAt(product, product.shelf))}" r="3.1" fill="var(--paper)" stroke="${product.color}" stroke-width="2" opacity="${hasFocus ? (emphasized ? 1 : .22) : .77}"/>`;
      });
      chart.setAttribute('viewBox', `0 0 ${width} ${height}`);
      chart.innerHTML = markup;
      chart.querySelectorAll('[data-product]').forEach(path => path.addEventListener('mouseenter', () => {
        const index = Number(path.dataset.product);
        if (hovered !== index) { hovered = index; drawChart(); }
      }));
      chart.querySelectorAll('[data-product]').forEach(line => line.addEventListener('click', event => {
        event.stopPropagation();
        selected = Number(line.dataset.product);
        hovered = null;
        drawChart();
      }));
      updateProductPanel();
    }

    wrap.addEventListener('mousemove', event => {
      if (!products.length) { tooltip.style.display = "none"; return; }
      const box = wrap.getBoundingClientRect();
      const width = box.width;
      const height = box.height;
      const padLeft = width < 500 ? 51 : 60;
      const padRight = width < 500 ? 18 : 27;
      const day = Math.max(0, Math.min(maxDays, (event.clientX - box.left - padLeft) / (width - padLeft - padRight) * maxDays));
      const chartTop = 15;
      const chartBottom = width < 500 ? 45 : 48;
      const values = products.length ? products.flatMap(product => [product.max, product.min]) : [0, 1];
      const minValue = Math.max(0, Math.floor(Math.min(...values) / 10) * 10);
      const maxValue = Math.ceil(Math.max(...values) / 10) * 10;
      const plotHeight = height - chartTop - chartBottom;
      let closest = null;
      let closestDistance = 15;
      products.forEach((product, index) => {
        if (!visible[index]) return;
        const rawPrice = priceAt(product, day);
        if (rawPrice === null) return;
        const params = product.curveParams || { freshnessPct, terminalPct };
        const { targetDay } = resolveCurveDays(product, params);
        const hasSubdivisions = usesSubdivisions(product);
        const segments = hasSubdivisions ? priceSegments(product) : [];
        const segment = segments.find(item => day >= item.start && day < item.end);
        const terminalStart = segments.length ? segments[segments.length - 1].end : targetDay;
        const price = hasSubdivisions && day >= terminalStart
          ? product.min
          : hasSubdivisions && segment
            ? segment.price
            : rawPrice;
        const lineY = chartTop + (maxValue - price) / (maxValue - minValue || 1) * plotHeight;
        const distance = Math.abs(event.clientY - box.top - lineY);
        if (distance < closestDistance) { closest = index; closestDistance = distance; }
      });
      if (hovered !== closest) { hovered = closest; drawChart(); }
      updateProductPanel();
      const wholeDay = Math.round(day);
      const active = products.map((product, index) => ({ product, index })).filter(({ index }) => visible[index]);
      tooltip.innerHTML = `<strong>Dia ${wholeDay} · preços estimados</strong>` + active.map(({ product, index }) => {
        const hasSubdivisions = usesSubdivisions(product);
        const segments = hasSubdivisions ? priceSegments(product) : [];
        const segment = segments.find(item => wholeDay >= item.start && wholeDay < item.end);
        const params = product.curveParams || { freshnessPct, terminalPct };
        const { targetDay } = resolveCurveDays(product, params);
        const terminalStart = segments.length ? segments[segments.length - 1].end : targetDay;
        const price = hasSubdivisions && wholeDay >= terminalStart && wholeDay <= product.shelf
          ? product.min
          : hasSubdivisions && segment
            ? segment.price
            : priceAt(product, wholeDay);
        const focusClass = hovered === index ? ' is-highlighted' : hovered !== null ? ' is-dimmed' : '';
        return `<span class="tooltip-row${focusClass}"><i style="background:${product.color}"></i>${escapeHtml(product.name)}: <b>${price === null ? 'fora do prazo' : money(price)}</b></span>`;
      }).join('');
      tooltip.style.display = 'block';
      const tipW = tooltip.offsetWidth || 210;
      const tipH = tooltip.offsetHeight || 160;
      const cursorX = event.clientX - box.left;
      const cursorY = event.clientY - box.top;
      const leftPos = cursorX + 16 + tipW <= width - 8 ? cursorX + 16 : Math.max(8, cursorX - tipW - 16);
      const topPos = Math.min(Math.max(6, cursorY - 18), Math.max(6, height - tipH - 6));
      tooltip.style.left = `${leftPos}px`;
      tooltip.style.top = `${topPos}px`;
    });
    wrap.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; if (hovered !== null) { hovered = null; drawChart(); } else updateProductPanel(); });
    document.addEventListener('click', event => {
      if (event.target.closest('.product-card, [data-product]')) return;
      if (selected !== null || hovered !== null) {
        selected = null;
        hovered = null;
        list.querySelectorAll('.product-card').forEach(card => card.classList.remove('is-active'));
        drawChart();
      }
    });
    document.querySelectorAll('[data-range]').forEach(button => button.addEventListener('click', () => {
      maxDays = Number(button.dataset.range);
      document.querySelectorAll('[data-range]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      drawChart();
    }));
    const terminalDaysSlider = document.querySelector('#terminal-days');
    const terminalDaysValueDisplay = document.querySelector('#terminal-days-value');
    const freshnessDaysSlider = document.querySelector('#freshness-days');
    const freshnessDaysValueDisplay = document.querySelector('#freshness-days-value');
    const curvatureSlider = document.querySelector('#curvature');
    const curvatureValueDisplay = document.querySelector('#curvature-value');
    const subdivisionsSlider = document.querySelector('#subdivisions');
    const subdivisionsValueDisplay = document.querySelector('#subdivisions-value');
    const subdivisionsToggle = document.querySelector('#subdivisions-enabled');

    function positionSliderValue(slider, display) {
      const min = Number(slider.min);
      const max = Number(slider.max);
      const ratio = max === min ? 0 : (Number(slider.value) - min) / (max - min);
      const lineRect = slider.parentElement.getBoundingClientRect();
      const sliderRect = slider.getBoundingClientRect();
      const thumbSize = 16;
      const thumbCenter = sliderRect.left - lineRect.left + thumbSize / 2 + Math.max(0, sliderRect.width - thumbSize) * ratio;
      display.style.left = `${thumbCenter}px`;
    }

    function positionAllSliderValues() {
      positionSliderValue(freshnessDaysSlider, freshnessDaysValueDisplay);
      positionSliderValue(terminalDaysSlider, terminalDaysValueDisplay);
      positionSliderValue(curvatureSlider, curvatureValueDisplay);
      positionSliderValue(subdivisionsSlider, subdivisionsValueDisplay);
    }

    terminalDaysSlider.addEventListener('input', event => {
      terminalPct = Number(event.currentTarget.value);
      terminalDaysValueDisplay.textContent = `${terminalPct}%`;
      positionSliderValue(terminalDaysSlider, terminalDaysValueDisplay);
      saveCurveSettings();
      drawChart();
    });
    freshnessDaysSlider.addEventListener('input', event => {
      freshnessPct = Number(event.currentTarget.value);
      freshnessDaysValueDisplay.textContent = `${freshnessPct}%`;
      positionSliderValue(freshnessDaysSlider, freshnessDaysValueDisplay);
      saveCurveSettings();
      drawChart();
    });
    curvatureSlider.addEventListener('input', event => {
      curvature = Number(event.currentTarget.value);
      curvatureValueDisplay.textContent = curvature.toFixed(1).replace('.', ',');
      positionSliderValue(curvatureSlider, curvatureValueDisplay);
      saveCurveSettings();
      drawChart();
    });
    subdivisionsSlider.addEventListener('input', event => {
      subdivisions = Number(event.currentTarget.value);
      subdivisionsValueDisplay.textContent = String(subdivisions);
      positionSliderValue(subdivisionsSlider, subdivisionsValueDisplay);
      saveCurveSettings();
      drawChart();
    });
    freshnessDaysSlider.value = String(freshnessPct);
    terminalDaysSlider.value = String(terminalPct);
    curvatureSlider.value = String(curvature);
    subdivisionsSlider.value = String(subdivisions);
    freshnessDaysValueDisplay.textContent = `${freshnessPct}%`;
    terminalDaysValueDisplay.textContent = `${terminalPct}%`;
    curvatureValueDisplay.textContent = curvature.toFixed(1).replace('.', ',');
    subdivisionsValueDisplay.textContent = String(subdivisions);
    function updateSubdivisionsToggle() {
      subdivisionsToggle.setAttribute('aria-pressed', String(subdivisionsEnabled));
      subdivisionsToggle.textContent = subdivisionsEnabled ? '> Subdivisões <' : '< Subdivisões >';
    }
    updateSubdivisionsToggle();
    subdivisionsToggle.addEventListener('click', () => {
      subdivisionsEnabled = !subdivisionsEnabled;
      updateSubdivisionsToggle();
      saveCurveSettings();
      drawChart();
    });
    window.addEventListener('resize', () => {
      drawChart();
      positionAllSliderValues();
    });
    positionAllSliderValues();
    requestAnimationFrame(positionAllSliderValues);
    renderProducts();
    renderLegend();
    drawChart();
  </script>
</body>

</html>
